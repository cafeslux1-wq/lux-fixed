<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAFÉ LUX</title>
<!-- Instant redirect to the dashboard living in /public/ -->
<link rel="canonical" href="https://www.cafeslux.com/public/">
<script>
  // Forward root → /public/ as early as possible (preserves any deep path/query)
  (function () {
    var origin = location.origin;
    var rest = location.pathname.replace(/^\/+/, '');          // strip leading slash
    var target = origin + '/public/' + rest + location.search + location.hash;
    // Avoid loops if already under /public/
    if (location.pathname.indexOf('/public/') === 0) return;
    location.replace(target);
  })();
</script>
<!-- Fallback for no-JS / slow JS -->
<meta http-equiv="refresh" content="0;url=/public/">
<style>
  html,body{height:100%;margin:0}
  body{background:#070707;display:flex;align-items:center;justify-content:center;
    font-family:'Cinzel',serif;color:#C9A84C;
    background-image:radial-gradient(ellipse 60% 40% at 50% 35%,rgba(201,168,76,.08),transparent 60%)}
  .splash{text-align:center}
  .logo{font-size:30px;letter-spacing:8px;font-weight:700}
  .sub{font-family:'Cormorant Garamond',serif;font-style:italic;color:#8d877c;font-size:14px;margin-top:10px;letter-spacing:1px}
  .spin{margin:22px auto 0;width:26px;height:26px;border:2px solid rgba(201,168,76,.25);
    border-top-color:#C9A84C;border-radius:50%;animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  a{color:#C9A84C}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet">
</head>
<body>
  <div class="splash">
    <div class="logo">✦ CAFÉ LUX</div>
    <div class="sub">Chargement de la console…</div>
    <div class="spin"></div>
    <noscript><p class="sub"><a href="/public/">Entrer →</a></p></noscript>
  </div>
</body>
</html>
