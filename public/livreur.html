<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Café LUX — Livreur</title>
<script src="../src/js/lux-auth.js"></script>
<script src="../src/js/lux-orders.js"></script>
<script>window.LUX_API_URL = 'https://cafeslux-api-production.up.railway.app';</script>
<style>
  :root{
    --bg:#0b0d10; --panel:#14171d; --line:#262b34; --gold:#c9a84c;
    --txt:#f2efe8; --muted:#8b9099; --green:#4ade80; --red:#d6544a; --orange:#d99a4a;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:14px;background:var(--bg);color:var(--txt);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       max-width:540px;margin-inline:auto;padding-bottom:40px}

  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .eyebrow{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
  h1{font-size:19px;margin:2px 0 0}

  .gps{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);
       padding:7px 11px;border:1px solid var(--line);border-radius:999px}
  .gps .dot{width:8px;height:8px;border-radius:50%;background:#555}
  .gps.on .dot{background:var(--green);animation:blink 1.6s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.gps.on .dot{animation:none}}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;
        padding:15px;margin-bottom:12px}
  .card.mine{border-color:rgba(201,168,76,.45)}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .ref{font-size:16px;font-weight:700}
  .badge{font-size:10px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .badge.go{color:var(--gold);border-color:rgba(201,168,76,.45)}
  .badge.rdy{color:var(--green);border-color:rgba(74,222,128,.4)}
  .meta{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.6}
  .addr{font-size:13.5px;color:var(--txt);margin-top:8px;line-height:1.5}
  .items{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
  .total{font-size:17px;font-weight:700;color:var(--gold);margin-top:8px}

  .acts{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
  button,a.btn{flex:1 1 130px;padding:13px;border-radius:11px;border:0;font:inherit;font-size:14px;
          font-weight:600;cursor:pointer;min-height:48px;text-align:center;text-decoration:none;
          display:flex;align-items:center;justify-content:center;gap:6px}
  .primary{background:var(--gold);color:#111}
  .ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .green{background:var(--green);color:#0b1a0f}
  button:disabled{opacity:.5;cursor:not-allowed}
  button:focus-visible,a.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

  input{width:100%;padding:13px;font-size:16px;background:#0f1216;color:var(--txt);
        border:1.5px solid var(--line);border-radius:11px;margin-bottom:11px}
  input:focus{outline:2px solid var(--gold);outline-offset:1px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}

  .msg{padding:12px;border-radius:11px;font-size:13px;margin-bottom:12px;display:none;line-height:1.5}
  .msg.on{display:block}
  .err{background:rgba(214,84,74,.14);color:#f2a49c;border:1px solid rgba(214,84,74,.34)}
  .ok{background:rgba(74,222,128,.12);color:#9ddcb2;border:1px solid rgba(74,222,128,.3)}
  .warn{background:rgba(217,154,74,.14);color:#f0c48a;border:1px solid rgba(217,154,74,.34)}
  .empty{text-align:center;color:var(--muted);font-size:13.5px;padding:34px 14px;line-height:1.7}
  .hidden{display:none}

  /* Bascule de rôle */
  .rolebar{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:10px 12px;
           background:rgba(201,168,76,.06);border:1px solid rgba(201,168,76,.2);border-radius:13px}
  .rl{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .rbtns{display:flex;gap:7px;margin-left:auto}
  .rbtn{width:auto;padding:9px 15px;min-height:40px;margin:0;border-radius:999px;font-size:13px;
        background:transparent;color:var(--muted);border:1px solid var(--line)}
  .rbtn.active{background:var(--gold);color:#111;border-color:var(--gold)}

  /* Disponibilité */
  .prow{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .pname{font-size:17px;font-weight:700}
  .psub{font-size:12.5px;color:var(--muted);margin-top:3px}
  .toggle{width:60px;height:33px;flex:none;border-radius:999px;background:#2a3038;border:0;
          padding:3px;margin:0;position:relative;cursor:pointer;transition:background .2s;min-height:33px}
  .toggle[aria-checked="true"]{background:var(--green)}
  .knob{display:block;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s}
  .toggle[aria-checked="true"] .knob{transform:translateX(27px)}
  .pstats{display:flex;margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}
  .ps{flex:1;text-align:center}
  .ps+.ps{border-left:1px solid var(--line)}
  .ps .v{font-size:18px;font-weight:700}
  .ps .k{font-size:11px;color:var(--muted);margin-top:2px}

  /* Demandes de course */
  .req{background:#1b1f27;border:1px solid rgba(201,168,76,.35);border-radius:15px;
       padding:14px;margin-bottom:11px}
  .req .t{font-size:14.5px;font-weight:600}
  .req .m{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.6}

  /* ══ En-tête ══ */
  .icon-btn{width:44px;height:44px;min-height:44px;flex:none;margin:0;padding:0;border-radius:50%;
            background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.35);
            color:var(--gold);font-size:18px;cursor:pointer}

  /* ══ Bandeau de service ══ */
  .shift{background:var(--panel);border:1px solid var(--line);border-radius:18px;
         padding:16px;margin-bottom:12px;transition:background .25s,border-color .25s}
  .shift.on{background:linear-gradient(160deg,rgba(74,222,128,.14),rgba(74,222,128,.04));
            border-color:rgba(74,222,128,.42)}
  .shift-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .ident{display:flex;align-items:center;gap:12px;min-width:0}
  .ava{width:48px;height:48px;flex:none;border-radius:50%;background:rgba(201,168,76,.16);
       color:var(--gold);display:flex;align-items:center;justify-content:center;
       font-size:20px;font-weight:700}
  .shift.on .ava{background:rgba(74,222,128,.2);color:var(--green)}
  .pname{font-size:17px;font-weight:700}
  .psub{font-size:12.5px;color:var(--muted);margin-top:3px}

  .gpsline{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);
           margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .gpsline .dot{width:8px;height:8px;border-radius:50%;background:#555;flex:none}
  .gpsline.on .dot{background:var(--green);animation:blink 1.6s infinite}
  .gpsline .acc{margin-left:auto;font-variant-numeric:tabular-nums}

  .pstats{display:flex;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .ps{flex:1;text-align:center}
  .ps+.ps{border-left:1px solid var(--line)}
  .ps .v{font-size:17px;font-weight:700}
  .ps .k{font-size:10.5px;color:var(--muted);margin-top:2px}

  /* ══ Étapes de la course ══ */
  .steps{display:flex;gap:6px;margin:12px 0 4px}
  .stp{flex:1;height:4px;border-radius:2px;background:#252b34}
  .stp.done{background:var(--gold)}
  .stp.now{background:var(--green)}
  .stplbl{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);
          margin-bottom:10px}
  .stplbl span.act{color:var(--green);font-weight:600}

  /* ══ Fiche publique ══ */
  .ov{position:fixed;inset:0;z-index:9990;display:none;align-items:flex-end;justify-content:center;
      background:rgba(6,6,6,.86);backdrop-filter:blur(6px)}
  .ov.on{display:flex}
  .ovbox{width:100%;max-width:520px;max-height:94vh;overflow:auto;background:var(--panel);
         border-radius:22px 22px 0 0;border:1px solid rgba(201,168,76,.28)}
  @media(min-width:540px){.ov{align-items:center}.ovbox{border-radius:22px}}
  .ovhead{background:linear-gradient(160deg,#d6a92b,#b8860b);padding:24px 20px 26px;
          text-align:center;color:#fff;position:relative;border-radius:21px 21px 0 0}
  .ovx{position:absolute;top:12px;right:12px;width:34px;height:34px;min-height:34px;margin:0;padding:0;
       border-radius:50%;background:rgba(255,255,255,.9);border:0;color:#2b2517;font-size:19px}
  .ovava{width:82px;height:82px;margin:0 auto 10px;border-radius:50%;background:rgba(255,255,255,.22);
         border:3px solid rgba(255,255,255,.85);display:flex;align-items:center;
         justify-content:center;font-size:34px;font-weight:700}
  .ovhead h2{margin:0;font-size:21px}
  .pills{margin-top:10px}
  .pill{display:inline-block;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.24);
        font-size:12.5px;margin:0 3px}
  .ovbody{padding:16px}
  .pcstats{display:flex;background:#1b1f27;border:1px solid var(--line);border-radius:14px;
           margin:-30px 0 14px;position:relative;z-index:1}
  .pcs{flex:1;text-align:center;padding:14px}
  .pcs+.pcs{border-left:1px solid var(--line)}
  .pcs .v{font-size:18px;font-weight:700}
  .pcs .k{font-size:11px;color:var(--muted);margin-top:2px}
  .pctabs{display:flex;background:#1b1f27;border:1px solid var(--line);border-radius:12px;
          padding:4px;margin-bottom:12px}
  .pctab{flex:1;padding:11px;margin:0;min-height:44px;border:0;background:none;border-radius:9px;
         font:inherit;font-size:13px;font-weight:600;color:var(--muted)}
  .pctab[aria-selected="true"]{background:var(--gold);color:#111}
  .pcbox{background:#1b1f27;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  .pcrow{display:flex;justify-content:space-between;font-size:13.5px}
  .pcrow+.pcrow{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .pctag{font-size:11px;padding:4px 10px;border-radius:999px;background:rgba(74,222,128,.14);color:var(--green)}
  .pctag.off{background:rgba(255,255,255,.06);color:var(--muted)}
  .pcnote{font-size:11.5px;color:var(--muted);text-align:center;margin:12px 0 16px;line-height:1.6}
  .pclb{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  .pcin{width:100%;padding:12px;font-size:15px;background:#0f1216;color:var(--txt);
        border:1.5px solid var(--line);border-radius:11px;margin-bottom:11px}
</style>
</head>
<body>

<header>
  <div><div class="eyebrow">Café LUX — Taza</div><h1>Espace livreur</h1></div>
  <button class="icon-btn" onclick="openPublicCard()" title="Ma fiche publique">👁</button>
</header>

<!-- Retour à l'espace client : même compte, autre rôle. -->
<div class="rolebar hidden" id="rolebar">
  <span class="rl">Rôle</span>
  <div class="rbtns">
    <button class="rbtn" onclick="location.href='mon-espace/index.html'">👤 Client</button>
    <button class="rbtn active">🛵 Livreur</button>
  </div>
</div>

<!-- ══ Bandeau de service ══
     L'état de service doit se lire d'un coup d'œil, à bout de bras,
     casque sur la tête. D'où le fond qui change de couleur : vert
     quand on est visible des clients, sombre sinon. -->
<div class="shift hidden" id="presence">
  <div class="shift-top">
    <div class="ident">
      <div class="ava" id="p-ava">—</div>
      <div>
        <div class="pname" id="p-name">—</div>
        <div class="psub" id="p-status">Hors ligne</div>
      </div>
    </div>
    <button class="toggle" id="p-toggle" role="switch" aria-checked="false"
            onclick="toggleOnline()"><span class="knob"></span></button>
  </div>

  <div class="gpsline" id="gps">
    <span class="dot"></span><span id="gps-txt">GPS inactif</span>
    <span class="acc" id="gps-acc"></span>
  </div>

  <div class="pstats">
    <div class="ps"><div class="v" id="p-orders">0</div><div class="k">courses</div></div>
    <div class="ps"><div class="v" id="p-rating">—</div><div class="k" id="p-reviews">0 avis</div></div>
    <div class="ps"><div class="v" id="p-today">0</div><div class="k">aujourd’hui</div></div>
    <div class="ps"><div class="v" id="p-verified">—</div><div class="k">vérifié</div></div>
  </div>
</div>

<!-- Demandes de course venues du site public -->
<!-- Demandes de course venues du site public -->
<div id="requests"></div>

<!-- ══ Aperçu de la fiche publique ══
     Le livreur voit exactement ce que le client voit de lui dans
     « Chauffeurs à proximité » : mêmes onglets, mêmes chiffres.
     Les boutons du client (Chat, Demander) sont montrés inertes —
     il n'a évidemment pas à se commander lui-même. -->
<div class="ov" id="pubcard">
  <div class="ovbox">
    <div class="ovhead">
      <button class="ovx" onclick="closePublicCard()" aria-label="Fermer">&times;</button>
      <div class="ovava" id="pc-ava">—</div>
      <h2 id="pc-name">—</h2>
      <div class="pills">
        <span class="pill" id="pc-online">Hors ligne</span>
        <span class="pill" id="pc-verif">Non vérifié</span>
      </div>
    </div>

    <div class="ovbody">
      <div class="pcstats">
        <div class="pcs"><div class="v" id="pc-rating">—</div><div class="k" id="pc-reviews">0 avis</div></div>
        <div class="pcs"><div class="v" id="pc-orders">0</div><div class="k">courses</div></div>
      </div>

      <div class="pctabs">
        <button class="pctab" data-pt="services" aria-selected="true">📦 Services</button>
        <button class="pctab" data-pt="about" aria-selected="false">ℹ️ À propos</button>
      </div>
      <div id="pc-tab"></div>

      <div class="pcnote">Vue client — ces boutons sont ceux qu’il utilise pour vous joindre.</div>

      <label class="pclb" for="pc-vehicle">Mon véhicule</label>
      <input class="pcin" id="pc-vehicle" placeholder="Scooter, Voiture, À pied">
      <label class="pclb" for="pc-bio">Ma présentation</label>
      <input class="pcin" id="pc-bio" placeholder="Rapide et soigneux, quartier Medina">
      <label class="pclb" for="pc-phone">Téléphone professionnel</label>
      <input class="pcin" id="pc-phone" type="tel" placeholder="06XXXXXXXX">
      <button class="primary" onclick="savePublicCard()">Enregistrer ma fiche</button>
    </div>
  </div>
</div>

<div class="msg" id="msg"></div>

<!-- Connexion -->
<div class="card" id="auth">
  <label for="pin">Code PIN livreur</label>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••">
  <button class="primary" id="btn-auth">Se connecter</button>
</div>

<!-- File des livraisons -->
<div id="queue" class="hidden"></div>

<script>
/* ══════════════════════════════════════════════════════════════
   Interface livreur — Café LUX

   Trois gestes seulement : je prends la commande, je préviens que
   je suis arrivé, j'ai livré. Le GPS ne s'active QUE pendant une
   course en cours et s'arrête à la livraison : on ne suit pas un
   livreur en dehors de son service.
══════════════════════════════════════════════════════════════ */
var API = window.LUX_API_URL || 'https://cafeslux-api-production.up.railway.app';

var ORDERS = [];
var WATCH = null;      // identifiant du watchPosition en cours
var ACTIVE = null;     // commande en cours de livraison
var TIMER = null;
var LAST_SENT = 0;

function el(id){ return document.getElementById(id); }
// Jeton PERSONNEL. Séparé du jeton client depuis lux-auth.js :
// se connecter à « Mon Espace » ne déconnecte plus le livreur.
function token(){
  try{ return (window.LuxAuth ? LuxAuth.staff.get() : localStorage.getItem('lux_staff_token')) || ''; }
  catch(e){ return ''; }
}

// Rôles autorisés à livrer (doit correspondre à DELIVERY_ROLES côté serveur).
var DRIVER_ROLES = ['ADMIN','MANAGER','CASHIER','STAFF'];

// Le jeton est un JWT : sa charge utile est lisible sans clé.
// On y lit le rôle pour savoir AVANT d'appeler l'API si ce jeton
// convient. Sinon on tombait sur « Accès refusé » sans explication.
function tokenRole(){
  var t = token();
  if(!t || t.indexOf('.') === -1) return null;
  try{
    var part = t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    return (JSON.parse(atob(part)).role || '').toUpperCase();
  }catch(e){ return null; }
}

// Les jetons client et personnel sont désormais séparés
// (lux-auth.js). On garde ce garde-fou pour les appareils qui
// portent encore un ancien jeton, et pour le cas où le rôle de
// l'employé ne l'autorise pas à livrer.
function forgetToken(){
  try{ if(window.LuxAuth) LuxAuth.staff.clear();
       else localStorage.removeItem('lux_staff_token'); }catch(e){}
}

function showLogin(message, kind){
  el('auth').classList.remove('hidden');
  ['queue','presence','rolebar'].forEach(function(id){ el(id).classList.add('hidden'); });
  el('requests').innerHTML = '';
  if(TIMER) clearInterval(TIMER);
  if(message) say(message, kind || 'warn');
}

function say(text, kind){
  var m = el('msg');
  m.textContent = text || '';
  m.className = 'msg' + (text ? ' on ' + (kind || 'err') : '');
}

function api(path, options){
  var o = options || {};
  return fetch(API + path, {
    method: o.method || 'GET',
    headers: { 'Content-Type':'application/json', Authorization: 'Bearer ' + token() },
    body: o.body ? JSON.stringify(o.body) : undefined
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(d){
      if(!r.ok){ var e = new Error(d.error || 'Erreur serveur'); e.status = r.status; throw e; }
      return d;
    });
  });
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}
function money(n){ return (Math.round((Number(n)||0)*100)/100).toFixed(2) + ' DH'; }

/* ── Connexion ────────────────────────────────────────────── */
el('btn-auth').onclick = function(){
  var pin = el('pin').value.trim();
  if(!pin) return say('Entrez votre code PIN.');

  var btn = this;
  btn.disabled = true; btn.textContent = 'Vérification…';

  fetch(API + '/api/auth/pin', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ pin: pin })
  })
    .then(function(r){ return r.json().catch(function(){ return {}; }); })
    .then(function(d){
      btn.disabled = false; btn.textContent = 'Se connecter';
      if(!d || !d.token) return say((d && d.error) || 'Code refusé par le serveur.');

      var role = ((d.employee && d.employee.role) || '').toUpperCase();
      if(role && DRIVER_ROLES.indexOf(role) === -1){
        return say('Le rôle « ' + role + ' » ne peut pas livrer. '
          + 'Demandez au responsable de vous passer en STAFF, ou utilisez un autre code PIN.');
      }

      if(window.LuxAuth) LuxAuth.staff.set(d.token);
      else localStorage.setItem('lux_staff_token', d.token);
      showDriverUI();
      say('Connecté : ' + ((d.employee && d.employee.name) || 'Livreur'), 'ok');
      start();
    })
    .catch(function(){
      btn.disabled = false; btn.textContent = 'Se connecter';
      say('Serveur injoignable. Vérifiez la connexion.');
    });
};

function showDriverUI(){
  ['auth'].forEach(function(id){ el(id).classList.add('hidden'); });
  ['queue','presence','rolebar'].forEach(function(id){ el(id).classList.remove('hidden'); });
}

/* ══ Profil et disponibilité ══════════════════════════════
   « En ligne » fait deux choses : le livreur apparaît dans
   l'annuaire public et sa position part au serveur. Se mettre
   hors ligne efface cette position — hors service, on ne suit
   personne. */
var ME = null;

function loadMe(){
  api('/api/delivery/me')
    .then(function(d){
      ME = d;
      el('p-ava').textContent     = (d.name || '?').trim().charAt(0).toUpperCase();
      el('p-name').textContent    = d.name || 'Livreur';
      el('p-status').textContent  = d.online ? 'En service — visible par les clients'
                                             : 'Hors service — invisible dans l\u2019annuaire';
      el('p-orders').textContent  = d.totalOrders || 0;
      el('p-rating').textContent  = d.rating != null ? '⭐ ' + d.rating : '—';
      el('p-reviews').textContent = (d.reviewsCount || 0) + ' avis';
      el('p-verified').textContent = d.verified ? 'Oui' : 'Non';

      el('p-toggle').setAttribute('aria-checked', String(!!d.online));
      // Le bandeau vire au vert : l'état de service se lit sans lire.
      el('presence').classList.toggle('on', !!d.online);

      if(d.online && !WATCH) startGps();
    })
    .catch(function(){ /* profil indisponible : la file reste utilisable */ });
}

// Courses terminées aujourd'hui — compté localement, remis à zéro
// chaque jour. Un chiffre qui bouge dans la journée motive plus
// qu'un total historique figé.
function bumpToday(){
  try{
    var key = 'lux_driver_day';
    var today = new Date().toISOString().slice(0,10);
    var raw = JSON.parse(localStorage.getItem(key) || '{}');
    if(raw.d !== today) raw = { d: today, n: 0 };
    raw.n = (raw.n || 0) + 1;
    localStorage.setItem(key, JSON.stringify(raw));
    el('p-today').textContent = raw.n;
  }catch(e){}
}

function showToday(){
  try{
    var raw = JSON.parse(localStorage.getItem('lux_driver_day') || '{}');
    var today = new Date().toISOString().slice(0,10);
    el('p-today').textContent = (raw.d === today ? raw.n : 0) || 0;
  }catch(e){}
}

function toggleOnline(){
  var next = el('p-toggle').getAttribute('aria-checked') !== 'true';
  el('p-toggle').setAttribute('aria-checked', String(next));

  api('/api/delivery/me/online', { method:'POST', body:{ online: next } })
    .then(function(){
      el('presence').classList.toggle('on', next);
      say(next ? 'En service — les clients peuvent vous demander.'
               : 'Hors service. Position effacée du serveur.', 'ok');
      if(next) startGps(); else if(!ACTIVE) stopGps();
      loadMe();
    })
    .catch(function(e){
      el('p-toggle').setAttribute('aria-checked', String(!next));
      say('✕ ' + e.message);
    });
}

/* ══ Demandes de course venues du site ══ */
function loadRequests(){
  api('/api/delivery/requests')
    .then(function(list){
      var box = el('requests');
      if(!list || !list.length){ box.innerHTML = ''; return; }

      box.innerHTML = list.map(function(r){
        var pending = r.status === 'PENDING';
        return '<div class="req">'
          + '<div class="t">' + (pending ? '🔔 Nouvelle demande' : '✅ Course acceptée') + '</div>'
          + '<div class="m">' + esc(r.customerName || 'Client') + ' · ' + esc(r.customerPhone)
          + (r.address ? '<br>📍 ' + esc(r.address) : '')
          + (r.note ? '<br>📝 ' + esc(r.note) : '') + '</div>'
          + '<div class="acts">'
          + '  <a class="btn ghost" href="tel:' + esc(r.customerPhone) + '">📞 Appeler</a>'
          + (pending
              ? '<button class="ghost" data-req="' + r.id + '" data-act="decline">Refuser</button>'
                + '<button class="green" data-req="' + r.id + '" data-act="accept">Accepter</button>'
              : '<button class="primary" data-req="' + r.id + '" data-act="done">Terminée</button>')
          + '</div></div>';
      }).join('');

      Array.prototype.forEach.call(box.querySelectorAll('[data-req]'), function(b){
        b.onclick = function(){
          api('/api/delivery/requests/' + b.dataset.req + '/' + b.dataset.act, { method:'POST' })
            .then(function(){ say('Demande mise à jour.', 'ok'); loadRequests(); })
            .catch(function(e){ say('✕ ' + e.message); });
        };
      });
    })
    .catch(function(){ /* silencieux */ });
}

/* ── File des livraisons ──────────────────────────────────── */
function start(){
  showToday();
  loadMe();
  loadQueue();
  loadRequests();

  // La commande apparaît dès que la cuisine la déclare prête,
  // sans attendre les 15 secondes du sondage.
  if(window.LuxOrders){
    LuxOrders.live({ apiBase: API, onChange: function(){ loadQueue(); loadRequests(); } });
  }
  if(TIMER) clearInterval(TIMER);
  TIMER = setInterval(function(){ loadQueue(); loadRequests(); }, 15000);
}

// « Tout afficher » : commandes prêtes non marquées livraison
// (commande passée par téléphone, oubli de l'adresse au comptoir).
var SHOW_ALL = false;
function toggleAll(){
  SHOW_ALL = !SHOW_ALL;
  loadQueue();
}

function loadQueue(){
  api('/api/delivery/queue' + (SHOW_ALL ? '?all=1' : ''))
    .then(function(list){
      ORDERS = list || [];
      renderQueue();
    })
    .catch(function(e){
      if(e.status === 401){
        forgetToken();
        showLogin('Session expirée. Reconnectez-vous avec votre code PIN.');
      } else if(e.status === 403){
        // Jeton valide mais rôle non autorisé : presque toujours un
        // jeton client laissé par « Mon Espace » sur ce téléphone.
        forgetToken();
        showLogin('Ce téléphone était connecté en tant que client. '
          + 'Saisissez votre code PIN employé pour accéder aux livraisons.');
      }
    });
}

function renderQueue(){
  var box = el('queue');

  var toggle = '<button class="ghost" style="margin-top:14px" onclick="toggleAll()">'
    + (SHOW_ALL ? '↩ Afficher seulement les livraisons'
                : '👁 Afficher toutes les commandes prêtes') + '</button>';

  if(!ORDERS.length){
    box.innerHTML = '<div class="empty">'
      + (SHOW_ALL
          ? 'Aucune commande prête pour le moment.'
          : 'Aucune livraison en attente.<br>Les commandes avec adresse arrivent ici automatiquement.')
      + '</div>' + toggle;
    return;
  }

  box.innerHTML = ORDERS.map(function(o){
    var going = o.step === 'OUT_FOR_DELIVERY';
    var ready = o.status === 'READY';
    var items = (o.items || []).map(function(it){
      return it.quantity + ' × ' + esc(it.name);
    }).join(' · ');

    var maps = o.destination
      ? 'https://www.google.com/maps/dir/?api=1&destination=' + o.destination.lat + ',' + o.destination.lng
      : (o.address ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(o.address) : null);

    // Trois étapes lisibles d'un coup d'œil : préparation, en route,
    // livrée. Le livreur sait où il en est sans lire un libellé.
    var stage = going ? 1 : (ready ? 0 : -1);
    var steps = '<div class="steps">'
      + '<div class="stp ' + (stage >= 0 ? (stage === 0 ? 'now' : 'done') : '') + '"></div>'
      + '<div class="stp ' + (stage >= 1 ? 'now' : '') + '"></div>'
      + '<div class="stp"></div>'
      + '</div>'
      + '<div class="stplbl">'
      + '<span' + (stage === 0 ? ' class="act"' : '') + '>Prête</span>'
      + '<span' + (stage === 1 ? ' class="act"' : '') + '>En route</span>'
      + '<span>Livrée</span>'
      + '</div>';

    return '<div class="card' + (o.mine ? ' mine' : '') + '">'
      + '<div class="row">'
      + '  <div class="ref">' + esc(o.ref) + '</div>'
      + '  <span class="badge ' + (going ? 'go' : (ready ? 'rdy' : '')) + '">'
      +     (going ? 'En route' : (ready ? 'Prête' : 'En préparation')) + '</span>'
      + '</div>'
      + steps
      + '<div class="meta">' + esc(o.customerName || 'Client') + '</div>'
      + (o.address ? '<div class="addr">📍 ' + esc(o.address) + '</div>' : '')
      + (items ? '<div class="items">' + items + '</div>' : '')
      + '<div class="total">' + money(o.totalAmount) + '</div>'
      + '<div class="acts">'
      +   (o.customerPhone ? '<a class="btn ghost" href="tel:' + esc(o.customerPhone) + '">📞 Client</a>' : '')
      +   (maps ? '<a class="btn ghost" href="' + maps + '" target="_blank" rel="noopener">🗺 Itinéraire</a>' : '')
      +   driverButtons(o)
      + '</div>'
      + '</div>';
  }).join('') + toggle;
}

// Les boutons proposés viennent de lux-orders.js : le livreur ne
// peut pas partir avec une commande que la cuisine n'a pas déclarée
// prête, et ne voit « Livrée » que s'il est effectivement en route.
function driverButtons(o){
  var next = window.LuxOrders
    ? LuxOrders.nextAction({ status: o.status, isDelivery: true }, 'driver')
    : null;

  if(!next){
    return '<button class="ghost" disabled>👨‍🍳 En cuisine…</button>';
  }
  if(next.action === 'PICKUP'){
    return '<button class="primary" data-order="' + o.id + '" data-act="PICKUP">'
      + next.label + '</button>';
  }
  return '<button class="ghost" data-order="' + o.id + '" data-act="ARRIVED">🔔 Je suis arrivé</button>'
    + '<button class="green" data-order="' + o.id + '" data-act="DELIVERED">' + next.label + '</button>';
}

// Délégation : plus de code JavaScript dans les attributs HTML,
// donc plus de risque de guillemets cassés (le bug qui avait rendu
// le bouton de la cuisine inerte).
document.addEventListener('click', function(ev){
  if(!ev.target.closest) return;
  var b = ev.target.closest('[data-order][data-act]');
  if(!b || b.disabled) return;
  ev.preventDefault();
  act(b.getAttribute('data-order'), b.getAttribute('data-act'));
});

/* ── Actions ──────────────────────────────────────────────── */
function act(orderId, action){
  api('/api/orders/' + encodeURIComponent(orderId) + '/delivery/status', {
    method: 'PATCH',
    body: { status: action }
  })
    .then(function(){
      if(action === 'PICKUP'){
        ACTIVE = orderId;
        startGps();
        say('Course démarrée — le client suit votre position.', 'ok');
      } else if(action === 'ARRIVED'){
        say('Le client a été prévenu de votre arrivée.', 'ok');
      } else if(action === 'DELIVERED'){
        if(ACTIVE === orderId){ ACTIVE = null; stopGps(); }
        bumpToday();
        say('Livraison confirmée. Merci !', 'ok');
      }
      loadQueue();
    })
    .catch(function(e){ say('✕ ' + e.message); });
}

/* ══ Fiche publique ══
   Le livreur voit sa carte telle que le client la découvre dans
   « Chauffeurs à proximité ». Il peut y corriger son véhicule, sa
   présentation et son téléphone professionnel — les seuls champs
   qui lui appartiennent. Le statut « vérifié » reste du ressort de
   l'administration : personne ne s'auto-certifie.
══════════════════════════════════════════════════════════════ */
var PC_TAB = 'services';

function openPublicCard(){
  if(!ME) return say('Profil en cours de chargement…', 'warn');

  el('pc-ava').textContent    = (ME.name || '?').trim().charAt(0).toUpperCase();
  el('pc-name').textContent   = ME.name || 'Livreur';
  el('pc-online').textContent = ME.online ? '🟢 En ligne' : '🌙 Hors ligne';
  el('pc-verif').textContent  = ME.verified ? '✔ Vérifié' : '⏳ Non vérifié';
  el('pc-rating').textContent = ME.rating != null ? '⭐ ' + ME.rating : '—';
  el('pc-reviews').textContent = (ME.reviewsCount || 0) + ' avis';
  el('pc-orders').textContent = ME.totalOrders || 0;
  el('pc-vehicle').value = ME.vehicle || '';
  el('pc-bio').value     = ME.bio || '';
  el('pc-phone').value   = ME.phone || '';

  PC_TAB = 'services';
  renderPcTab();
  el('pubcard').classList.add('on');
}

function closePublicCard(){ el('pubcard').classList.remove('on'); }

document.addEventListener('click', function(ev){
  if(!ev.target.closest) return;
  var t = ev.target.closest('.pctab');
  if(!t) return;
  PC_TAB = t.getAttribute('data-pt');
  Array.prototype.forEach.call(document.querySelectorAll('.pctab'), function(x){
    x.setAttribute('aria-selected', String(x.getAttribute('data-pt') === PC_TAB));
  });
  renderPcTab();
});

function renderPcTab(){
  var box = el('pc-tab');
  if(!ME) return;

  if(PC_TAB === 'about'){
    box.innerHTML =
      '<div class="pcbox">'
      + '<div style="font-weight:700;margin-bottom:10px">👤 Profil du chauffeur</div>'
      + '<div class="pcrow"><span>Vérifié</span><b>' + (ME.verified ? 'Oui' : 'Non') + '</b></div>'
      + '<div class="pcrow"><span>Véhicule</span><b>' + esc(ME.vehicle || 'Scooter') + '</b></div>'
      + '</div>'
      + '<div class="pcbox">'
      + '<div style="font-weight:700;margin-bottom:10px">📊 Performance</div>'
      + '<div class="pcrow"><span>Commandes totales</span><b>' + (ME.totalOrders || 0) + '</b></div>'
      + '<div class="pcrow"><span>Note moyenne</span><b>'
      +   (ME.rating != null ? '⭐ ' + ME.rating + ' / 5' : 'Pas encore noté') + '</b></div>'
      + '<div class="pcrow"><span>Avis</span><b>' + (ME.reviewsCount || 0) + ' avis</b></div>'
      + '</div>';
    return;
  }

  box.innerHTML =
    '<div class="pcbox">'
    + '<div class="pcrow">'
    + '  <div><div style="font-weight:700;font-size:15px">Delivery</div>'
    + '    <div style="color:var(--gold);font-weight:600;margin-top:3px">Contacter pour le prix</div></div>'
    + '  <span class="pctag' + (ME.online ? '' : ' off') + '">'
    +     (ME.online ? '● Disponible' : '● Indisponible') + '</span>'
    + '</div>'
    + '</div>'
    + '<div class="pcbox" style="opacity:.55">'
    + '  <div style="font-size:12.5px;color:var(--muted);margin-bottom:10px">'
    + '    ☑ J\u2019accepte les termes et conditions</div>'
    + '  <div class="acts" style="margin:0">'
    + '    <button class="ghost" disabled>💬 Chat</button>'
    + '    <button class="primary" disabled>Demander maintenant</button>'
    + '  </div>'
    + '</div>';
}

function savePublicCard(){
  api('/api/delivery/me', {
    method: 'PATCH',
    body: {
      vehicle: el('pc-vehicle').value.trim(),
      bio:     el('pc-bio').value.trim(),
      phone:   el('pc-phone').value.trim(),
    }
  })
    .then(function(){
      say('✓ Fiche mise à jour — les clients voient les nouvelles informations.', 'ok');
      closePublicCard();
      loadMe();
    })
    .catch(function(e){ say('✕ ' + e.message); });
}

/* ── GPS ──────────────────────────────────────────────────
   Actif uniquement pendant une course. On envoie au plus une
   position toutes les 10 secondes : suffisant pour une carte,
   et ça épargne la batterie et le forfait du livreur.
──────────────────────────────────────────────────────────── */
function startGps(){
  if(!navigator.geolocation) return say('Ce téléphone ne fournit pas de position GPS.', 'warn');
  if(WATCH !== null) return;

  WATCH = navigator.geolocation.watchPosition(function(pos){
    el('gps').classList.add('on');
    el('gps-txt').textContent = ACTIVE ? 'Position transmise au client' : 'Position partagée';
    // La précision dit au livreur si le GPS est fiable avant qu'il
    // n'accuse l'application d'afficher un mauvais point.
    if(pos.coords && pos.coords.accuracy){
      el('gps-acc').textContent = '±' + Math.round(pos.coords.accuracy) + ' m';
    }

    var now = Date.now();
    if(now - LAST_SENT < 10000) return;
    LAST_SENT = now;

    var coords = { lat: pos.coords.latitude, lng: pos.coords.longitude };

    // En course : la position va sur la commande (le client la voit).
    // Sinon : elle alimente seulement l'annuaire « à proximité ».
    var path = ACTIVE
      ? '/api/orders/' + encodeURIComponent(ACTIVE) + '/driver-location'
      : '/api/delivery/me/location';

    api(path, { method: 'POST', body: coords })
      .catch(function(){ /* perte réseau : la prochaine position repartira */ });

  }, function(err){
    el('gps').classList.remove('on');
    el('gps-txt').textContent = 'GPS refusé';
    say(err.code === 1
      ? 'Autorisez la localisation pour que le client vous suive sur la carte.'
      : 'Position indisponible — le suivi carte sera inactif.', 'warn');
  }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
}

function stopGps(){
  if(WATCH !== null){ navigator.geolocation.clearWatch(WATCH); WATCH = null; }
  el('gps').classList.remove('on');
  el('gps-txt').textContent = 'GPS inactif';
  el('gps-acc').textContent = '';
}

// Session encore valable : on saute la connexion.
(function(){
  var role = tokenRole();
  if(!role){ showLogin(); return; }

  if(DRIVER_ROLES.indexOf(role) === -1){
    // CUSTOMER, KITCHEN… : on repart proprement sur l'écran de code.
    forgetToken();
    showLogin(role === 'CUSTOMER'
      ? 'Ce téléphone est connecté en tant que client. Saisissez votre code PIN employé.'
      : 'Le rôle « ' + role + ' » ne peut pas livrer. Utilisez un code PIN autorisé.');
    return;
  }

  showDriverUI();
  start();
})();
