<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Café LUX — Livreur</title>
<script src="../src/js/lux-auth.js"></script>
<script>window.LUX_API_URL = 'https://cafeslux-api-production.up.railway.app';</script>
<style>
  :root{
    --bg:#0b0d10; --panel:#14171d; --line:#262b34; --gold:#c9a84c;
    --txt:#f2efe8; --muted:#8b9099; --green:#4ade80; --red:#d6544a; --orange:#d99a4a;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:14px;background:var(--bg);color:var(--txt);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       max-width:540px;margin-inline:auto;padding-bottom:40px}

  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .eyebrow{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
  h1{font-size:19px;margin:2px 0 0}

  .gps{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);
       padding:7px 11px;border:1px solid var(--line);border-radius:999px}
  .gps .dot{width:8px;height:8px;border-radius:50%;background:#555}
  .gps.on .dot{background:var(--green);animation:blink 1.6s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.gps.on .dot{animation:none}}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;
        padding:15px;margin-bottom:12px}
  .card.mine{border-color:rgba(201,168,76,.45)}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .ref{font-size:16px;font-weight:700}
  .badge{font-size:10px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .badge.go{color:var(--gold);border-color:rgba(201,168,76,.45)}
  .badge.rdy{color:var(--green);border-color:rgba(74,222,128,.4)}
  .meta{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.6}
  .addr{font-size:13.5px;color:var(--txt);margin-top:8px;line-height:1.5}
  .items{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
  .total{font-size:17px;font-weight:700;color:var(--gold);margin-top:8px}

  .acts{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
  button,a.btn{flex:1 1 130px;padding:13px;border-radius:11px;border:0;font:inherit;font-size:14px;
          font-weight:600;cursor:pointer;min-height:48px;text-align:center;text-decoration:none;
          display:flex;align-items:center;justify-content:center;gap:6px}
  .primary{background:var(--gold);color:#111}
  .ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .green{background:var(--green);color:#0b1a0f}
  button:disabled{opacity:.5;cursor:not-allowed}
  button:focus-visible,a.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

  input{width:100%;padding:13px;font-size:16px;background:#0f1216;color:var(--txt);
        border:1.5px solid var(--line);border-radius:11px;margin-bottom:11px}
  input:focus{outline:2px solid var(--gold);outline-offset:1px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}

  .msg{padding:12px;border-radius:11px;font-size:13px;margin-bottom:12px;display:none;line-height:1.5}
  .msg.on{display:block}
  .err{background:rgba(214,84,74,.14);color:#f2a49c;border:1px solid rgba(214,84,74,.34)}
  .ok{background:rgba(74,222,128,.12);color:#9ddcb2;border:1px solid rgba(74,222,128,.3)}
  .warn{background:rgba(217,154,74,.14);color:#f0c48a;border:1px solid rgba(217,154,74,.34)}
  .empty{text-align:center;color:var(--muted);font-size:13.5px;padding:34px 14px;line-height:1.7}
  .hidden{display:none}

  /* Bascule de rôle */
  .rolebar{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:10px 12px;
           background:rgba(201,168,76,.06);border:1px solid rgba(201,168,76,.2);border-radius:13px}
  .rl{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .rbtns{display:flex;gap:7px;margin-left:auto}
  .rbtn{width:auto;padding:9px 15px;min-height:40px;margin:0;border-radius:999px;font-size:13px;
        background:transparent;color:var(--muted);border:1px solid var(--line)}
  .rbtn.active{background:var(--gold);color:#111;border-color:var(--gold)}

  /* Disponibilité */
  .prow{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .pname{font-size:17px;font-weight:700}
  .psub{font-size:12.5px;color:var(--muted);margin-top:3px}
  .toggle{width:60px;height:33px;flex:none;border-radius:999px;background:#2a3038;border:0;
          padding:3px;margin:0;position:relative;cursor:pointer;transition:background .2s;min-height:33px}
  .toggle[aria-checked="true"]{background:var(--green)}
  .knob{display:block;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s}
  .toggle[aria-checked="true"] .knob{transform:translateX(27px)}
  .pstats{display:flex;margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}
  .ps{flex:1;text-align:center}
  .ps+.ps{border-left:1px solid var(--line)}
  .ps .v{font-size:18px;font-weight:700}
  .ps .k{font-size:11px;color:var(--muted);margin-top:2px}

  /* Demandes de course */
  .req{background:#1b1f27;border:1px solid rgba(201,168,76,.35);border-radius:15px;
       padding:14px;margin-bottom:11px}
  .req .t{font-size:14.5px;font-weight:600}
  .req .m{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.6}
</style>
</head>
<body>

<header>
  <div><div class="eyebrow">Café LUX — Taza</div><h1>Espace livreur</h1></div>
  <div class="gps" id="gps"><span class="dot"></span><span id="gps-txt">GPS inactif</span></div>
</header>

<!-- Retour à l'espace client : même compte, autre rôle. -->
<div class="rolebar hidden" id="rolebar">
  <span class="rl">Rôle</span>
  <div class="rbtns">
    <button class="rbtn" onclick="location.href='mon-espace/index.html'">👤 Client</button>
    <button class="rbtn active">🛵 Livreur</button>
  </div>
</div>

<!-- ══ Disponibilité ══
     Hors ligne, le livreur disparaît de l'annuaire public et sa
     position est effacée du serveur. C'est son interrupteur, pas
     celui du patron. -->
<div class="card hidden" id="presence">
  <div class="prow">
    <div>
      <div class="pname" id="p-name">—</div>
      <div class="psub" id="p-status">Hors ligne</div>
    </div>
    <button class="toggle" id="p-toggle" role="switch" aria-checked="false"
            onclick="toggleOnline()"><span class="knob"></span></button>
  </div>
  <div class="pstats">
    <div class="ps"><div class="v" id="p-orders">0</div><div class="k">courses</div></div>
    <div class="ps"><div class="v" id="p-rating">—</div><div class="k" id="p-reviews">0 avis</div></div>
    <div class="ps"><div class="v" id="p-verified">—</div><div class="k">vérifié</div></div>
  </div>
</div>

<!-- Demandes de course venues du site public -->
<div id="requests"></div>

<div class="msg" id="msg"></div>

<!-- Connexion -->
<div class="card" id="auth">
  <label for="pin">Code PIN livreur</label>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••">
  <button class="primary" id="btn-auth">Se connecter</button>
</div>

<!-- File des livraisons -->
<div id="queue" class="hidden"></div>

<script>
/* ══════════════════════════════════════════════════════════════
   Interface livreur — Café LUX

   Trois gestes seulement : je prends la commande, je préviens que
   je suis arrivé, j'ai livré. Le GPS ne s'active QUE pendant une
   course en cours et s'arrête à la livraison : on ne suit pas un
   livreur en dehors de son service.
══════════════════════════════════════════════════════════════ */
var API = window.LUX_API_URL || 'https://cafeslux-api-production.up.railway.app';

var ORDERS = [];
var WATCH = null;      // identifiant du watchPosition en cours
var ACTIVE = null;     // commande en cours de livraison
var TIMER = null;
var LAST_SENT = 0;

function el(id){ return document.getElementById(id); }
// Jeton PERSONNEL. Séparé du jeton client depuis lux-auth.js :
// se connecter à « Mon Espace » ne déconnecte plus le livreur.
function token(){
  try{ return (window.LuxAuth ? LuxAuth.staff.get() : localStorage.getItem('lux_staff_token')) || ''; }
  catch(e){ return ''; }
}

// Rôles autorisés à livrer (doit correspondre à DELIVERY_ROLES côté serveur).
var DRIVER_ROLES = ['ADMIN','MANAGER','CASHIER','STAFF'];

// Le jeton est un JWT : sa charge utile est lisible sans clé.
// On y lit le rôle pour savoir AVANT d'appeler l'API si ce jeton
// convient. Sinon on tombait sur « Accès refusé » sans explication.
function tokenRole(){
  var t = token();
  if(!t || t.indexOf('.') === -1) return null;
  try{
    var part = t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    return (JSON.parse(atob(part)).role || '').toUpperCase();
  }catch(e){ return null; }
}

// Les jetons client et personnel sont désormais séparés
// (lux-auth.js). On garde ce garde-fou pour les appareils qui
// portent encore un ancien jeton, et pour le cas où le rôle de
// l'employé ne l'autorise pas à livrer.
function forgetToken(){
  try{ if(window.LuxAuth) LuxAuth.staff.clear();
       else localStorage.removeItem('lux_staff_token'); }catch(e){}
}

function showLogin(message, kind){
  el('auth').classList.remove('hidden');
  ['queue','presence','rolebar'].forEach(function(id){ el(id).classList.add('hidden'); });
  el('requests').innerHTML = '';
  if(TIMER) clearInterval(TIMER);
  if(message) say(message, kind || 'warn');
}

function say(text, kind){
  var m = el('msg');
  m.textContent = text || '';
  m.className = 'msg' + (text ? ' on ' + (kind || 'err') : '');
}

function api(path, options){
  var o = options || {};
  return fetch(API + path, {
    method: o.method || 'GET',
    headers: { 'Content-Type':'application/json', Authorization: 'Bearer ' + token() },
    body: o.body ? JSON.stringify(o.body) : undefined
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(d){
      if(!r.ok){ var e = new Error(d.error || 'Erreur serveur'); e.status = r.status; throw e; }
      return d;
    });
  });
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}
function money(n){ return (Math.round((Number(n)||0)*100)/100).toFixed(2) + ' DH'; }

/* ── Connexion ────────────────────────────────────────────── */
el('btn-auth').onclick = function(){
  var pin = el('pin').value.trim();
  if(!pin) return say('Entrez votre code PIN.');

  var btn = this;
  btn.disabled = true; btn.textContent = 'Vérification…';

  fetch(API + '/api/auth/pin', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ pin: pin })
  })
    .then(function(r){ return r.json().catch(function(){ return {}; }); })
    .then(function(d){
      btn.disabled = false; btn.textContent = 'Se connecter';
      if(!d || !d.token) return say((d && d.error) || 'Code refusé par le serveur.');

      var role = ((d.employee && d.employee.role) || '').toUpperCase();
      if(role && DRIVER_ROLES.indexOf(role) === -1){
        return say('Le rôle « ' + role + ' » ne peut pas livrer. '
          + 'Demandez au responsable de vous passer en STAFF, ou utilisez un autre code PIN.');
      }

      if(window.LuxAuth) LuxAuth.staff.set(d.token);
      else localStorage.setItem('lux_staff_token', d.token);
      showDriverUI();
      say('Connecté : ' + ((d.employee && d.employee.name) || 'Livreur'), 'ok');
      start();
    })
    .catch(function(){
      btn.disabled = false; btn.textContent = 'Se connecter';
      say('Serveur injoignable. Vérifiez la connexion.');
    });
};

function showDriverUI(){
  ['auth'].forEach(function(id){ el(id).classList.add('hidden'); });
  ['queue','presence','rolebar'].forEach(function(id){ el(id).classList.remove('hidden'); });
}

/* ══ Profil et disponibilité ══════════════════════════════
   « En ligne » fait deux choses : le livreur apparaît dans
   l'annuaire public et sa position part au serveur. Se mettre
   hors ligne efface cette position — hors service, on ne suit
   personne. */
var ME = null;

function loadMe(){
  api('/api/delivery/me')
    .then(function(d){
      ME = d;
      el('p-name').textContent    = d.name || 'Livreur';
      el('p-status').textContent  = d.online ? 'En ligne — visible par les clients'
                                             : 'Hors ligne — invisible dans l\u2019annuaire';
      el('p-orders').textContent  = d.totalOrders || 0;
      el('p-rating').textContent  = d.rating != null ? '⭐ ' + d.rating : '—';
      el('p-reviews').textContent = (d.reviewsCount || 0) + ' avis';
      el('p-verified').textContent = d.verified ? 'Oui' : 'Non';

      var t = el('p-toggle');
      t.setAttribute('aria-checked', String(!!d.online));

      if(d.online && !WATCH) startGps();
    })
    .catch(function(){ /* profil indisponible : la file reste utilisable */ });
}

function toggleOnline(){
  var next = el('p-toggle').getAttribute('aria-checked') !== 'true';
  el('p-toggle').setAttribute('aria-checked', String(next));

  api('/api/delivery/me/online', { method:'POST', body:{ online: next } })
    .then(function(){
      say(next ? 'Vous êtes en ligne — les clients peuvent vous demander.'
               : 'Vous êtes hors ligne. Position effacée.', 'ok');
      if(next) startGps(); else if(!ACTIVE) stopGps();
      loadMe();
    })
    .catch(function(e){
      el('p-toggle').setAttribute('aria-checked', String(!next));
      say('✕ ' + e.message);
    });
}

/* ══ Demandes de course venues du site ══ */
function loadRequests(){
  api('/api/delivery/requests')
    .then(function(list){
      var box = el('requests');
      if(!list || !list.length){ box.innerHTML = ''; return; }

      box.innerHTML = list.map(function(r){
        var pending = r.status === 'PENDING';
        return '<div class="req">'
          + '<div class="t">' + (pending ? '🔔 Nouvelle demande' : '✅ Course acceptée') + '</div>'
          + '<div class="m">' + esc(r.customerName || 'Client') + ' · ' + esc(r.customerPhone)
          + (r.address ? '<br>📍 ' + esc(r.address) : '')
          + (r.note ? '<br>📝 ' + esc(r.note) : '') + '</div>'
          + '<div class="acts">'
          + '  <a class="btn ghost" href="tel:' + esc(r.customerPhone) + '">📞 Appeler</a>'
          + (pending
              ? '<button class="ghost" data-req="' + r.id + '" data-act="decline">Refuser</button>'
                + '<button class="green" data-req="' + r.id + '" data-act="accept">Accepter</button>'
              : '<button class="primary" data-req="' + r.id + '" data-act="done">Terminée</button>')
          + '</div></div>';
      }).join('');

      Array.prototype.forEach.call(box.querySelectorAll('[data-req]'), function(b){
        b.onclick = function(){
          api('/api/delivery/requests/' + b.dataset.req + '/' + b.dataset.act, { method:'POST' })
            .then(function(){ say('Demande mise à jour.', 'ok'); loadRequests(); })
            .catch(function(e){ say('✕ ' + e.message); });
        };
      });
    })
    .catch(function(){ /* silencieux */ });
}

/* ── File des livraisons ──────────────────────────────────── */
function start(){
  loadMe();
  loadQueue();
  loadRequests();
  if(TIMER) clearInterval(TIMER);
  TIMER = setInterval(function(){ loadQueue(); loadRequests(); }, 15000);
}

// « Tout afficher » : commandes prêtes non marquées livraison
// (commande passée par téléphone, oubli de l'adresse au comptoir).
var SHOW_ALL = false;
function toggleAll(){
  SHOW_ALL = !SHOW_ALL;
  loadQueue();
}

function loadQueue(){
  api('/api/delivery/queue' + (SHOW_ALL ? '?all=1' : ''))
    .then(function(list){
      ORDERS = list || [];
      renderQueue();
    })
    .catch(function(e){
      if(e.status === 401){
        forgetToken();
        showLogin('Session expirée. Reconnectez-vous avec votre code PIN.');
      } else if(e.status === 403){
        // Jeton valide mais rôle non autorisé : presque toujours un
        // jeton client laissé par « Mon Espace » sur ce téléphone.
        forgetToken();
        showLogin('Ce téléphone était connecté en tant que client. '
          + 'Saisissez votre code PIN employé pour accéder aux livraisons.');
      }
    });
}

function renderQueue(){
  var box = el('queue');

  var toggle = '<button class="ghost" style="margin-top:14px" onclick="toggleAll()">'
    + (SHOW_ALL ? '↩ Afficher seulement les livraisons'
                : '👁 Afficher toutes les commandes prêtes') + '</button>';

  if(!ORDERS.length){
    box.innerHTML = '<div class="empty">'
      + (SHOW_ALL
          ? 'Aucune commande prête pour le moment.'
          : 'Aucune livraison en attente.<br>Les commandes avec adresse arrivent ici automatiquement.')
      + '</div>' + toggle;
    return;
  }

  box.innerHTML = ORDERS.map(function(o){
    var going = o.step === 'OUT_FOR_DELIVERY';
    var ready = o.status === 'READY';
    var items = (o.items || []).map(function(it){
      return it.quantity + ' × ' + esc(it.name);
    }).join(' · ');

    var maps = o.destination
      ? 'https://www.google.com/maps/dir/?api=1&destination=' + o.destination.lat + ',' + o.destination.lng
      : (o.address ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(o.address) : null);

    return '<div class="card' + (o.mine ? ' mine' : '') + '">'
      + '<div class="row">'
      + '  <div class="ref">' + esc(o.ref) + '</div>'
      + '  <span class="badge ' + (going ? 'go' : (ready ? 'rdy' : '')) + '">'
      +     (going ? 'En route' : (ready ? 'Prête' : 'En préparation')) + '</span>'
      + '</div>'
      + '<div class="meta">' + esc(o.customerName || 'Client') + '</div>'
      + (o.address ? '<div class="addr">📍 ' + esc(o.address) + '</div>' : '')
      + (items ? '<div class="items">' + items + '</div>' : '')
      + '<div class="total">' + money(o.totalAmount) + '</div>'
      + '<div class="acts">'
      +   (o.customerPhone ? '<a class="btn ghost" href="tel:' + esc(o.customerPhone) + '">📞 Client</a>' : '')
      +   (maps ? '<a class="btn ghost" href="' + maps + '" target="_blank" rel="noopener">🗺 Itinéraire</a>' : '')
      +   (!going
            ? '<button class="primary" onclick="act(\'' + o.id + '\',\'PICKUP\')" '
              + (ready ? '' : 'disabled title="La commande n\'est pas encore prête"') + '>🛵 Je pars</button>'
            : '<button class="ghost" onclick="act(\'' + o.id + '\',\'ARRIVED\')">🔔 Je suis arrivé</button>'
              + '<button class="green" onclick="act(\'' + o.id + '\',\'DELIVERED\')">✅ Livrée</button>')
      + '</div>'
      + '</div>';
  }).join('') + toggle;
}

/* ── Actions ──────────────────────────────────────────────── */
function act(orderId, action){
  api('/api/orders/' + encodeURIComponent(orderId) + '/delivery/status', {
    method: 'PATCH',
    body: { status: action }
  })
    .then(function(){
      if(action === 'PICKUP'){
        ACTIVE = orderId;
        startGps();
        say('Course démarrée — le client suit votre position.', 'ok');
      } else if(action === 'ARRIVED'){
        say('Le client a été prévenu de votre arrivée.', 'ok');
      } else if(action === 'DELIVERED'){
        if(ACTIVE === orderId){ ACTIVE = null; stopGps(); }
        say('Livraison confirmée. Merci !', 'ok');
      }
      loadQueue();
    })
    .catch(function(e){ say('✕ ' + e.message); });
}

/* ── GPS ──────────────────────────────────────────────────
   Actif uniquement pendant une course. On envoie au plus une
   position toutes les 10 secondes : suffisant pour une carte,
   et ça épargne la batterie et le forfait du livreur.
──────────────────────────────────────────────────────────── */
function startGps(){
  if(!navigator.geolocation) return say('Ce téléphone ne fournit pas de position GPS.', 'warn');
  if(WATCH !== null) return;

  WATCH = navigator.geolocation.watchPosition(function(pos){
    el('gps').classList.add('on');
    el('gps-txt').textContent = 'Position partagée';

    var now = Date.now();
    if(now - LAST_SENT < 10000) return;
    LAST_SENT = now;

    var coords = { lat: pos.coords.latitude, lng: pos.coords.longitude };

    // En course : la position va sur la commande (le client la voit).
    // Sinon : elle alimente seulement l'annuaire « à proximité ».
    var path = ACTIVE
      ? '/api/orders/' + encodeURIComponent(ACTIVE) + '/driver-location'
      : '/api/delivery/me/location';

    api(path, { method: 'POST', body: coords })
      .catch(function(){ /* perte réseau : la prochaine position repartira */ });

  }, function(err){
    el('gps').classList.remove('on');
    el('gps-txt').textContent = 'GPS refusé';
    say(err.code === 1
      ? 'Autorisez la localisation pour que le client vous suive sur la carte.'
      : 'Position indisponible — le suivi carte sera inactif.', 'warn');
  }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
}

function stopGps(){
  if(WATCH !== null){ navigator.geolocation.clearWatch(WATCH); WATCH = null; }
  el('gps').classList.remove('on');
  el('gps-txt').textContent = 'GPS inactif';
}

// Session encore valable : on saute la connexion.
(function(){
  var role = tokenRole();
  if(!role){ showLogin(); return; }

  if(DRIVER_ROLES.indexOf(role) === -1){
    // CUSTOMER, KITCHEN… : on repart proprement sur l'écran de code.
    forgetToken();
    showLogin(role === 'CUSTOMER'
      ? 'Ce téléphone est connecté en tant que client. Saisissez votre code PIN employé.'
      : 'Le rôle « ' + role + ' » ne peut pas livrer. Utilisez un code PIN autorisé.');
    return;
  }

  showDriverUI();
  start();
})();
</script>
</body>
</html>
