<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#C9A84C">
<title>CAFÉ LUX — Commander</title>

<!-- ── API Config ──────────────────────────────────────────── -->
<script>window.LUX_API_URL = 'https://cafeslux-api-production.up.railway.app';</script>

<!-- ── Stripe JS v3 (requis pour paiement en ligne) ───────── -->
<script src="https://js.stripe.com/v3/"></script>

<!-- ── Fonts ───────────────────────────────────────────────── -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
/* ── Design Tokens ─────────────────────────────────────────── */
:root{
  --gold:#C9A84C;--gold-l:#E8C97A;--gold-d:#8B6E2F;
  --bg:#F9F5EE;--bg2:#FFFFFF;--bg3:#F0EAD9;
  --dark:#080808;--text:#1A0A00;--muted:#888;
  --border:rgba(201,168,76,.25);--border2:rgba(201,168,76,.5);
  --green:#2ECC71;--red:#E74C3C;
  --font-display:'Playfair Display',serif;
  --font-body:'DM Sans',sans-serif;
  --font-it:'Cormorant Garamond',serif;
  --topbar-h:60px;--sidebar-w:220px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;-webkit-font-smoothing:antialiased}
body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body);overflow:hidden}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
input,button,select,textarea{font-family:inherit}

/* ── Topbar ────────────────────────────────────────────────── */
.topbar{
  height:var(--topbar-h);background:var(--dark);
  display:flex;align-items:center;padding:0 16px;gap:12px;
  position:fixed;top:0;left:0;right:0;z-index:200;
  border-bottom:2px solid var(--gold-d);
}
.topbar-logo{font-family:var(--font-display);color:var(--gold);font-size:18px;letter-spacing:3px;flex:1}
.topbar-title{font-size:12px;color:rgba(240,232,213,.6);letter-spacing:2px;text-transform:uppercase}
.btn-back{
  padding:7px 16px;background:transparent;border:1px solid rgba(201,168,76,.4);
  border-radius:20px;color:var(--gold);font-size:11px;font-weight:600;cursor:pointer;
  letter-spacing:.5px;transition:.2s;
}
.btn-back:hover{background:rgba(201,168,76,.1)}
.cart-badge{
  background:var(--gold);color:#000;border-radius:50%;width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;
  margin-left:8px;cursor:pointer;transition:.2s;
}
.cart-badge:hover{transform:scale(1.1)}

/* ── Layout ────────────────────────────────────────────────── */
.app-layout{
  display:flex;height:100vh;padding-top:var(--topbar-h);
}

/* ── Sidebar (category nav) ────────────────────────────────── */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;background:var(--dark);
  overflow-y:auto;padding:12px 8px;border-right:1px solid rgba(201,168,76,.15);
}
.sidebar-label{font-size:9px;letter-spacing:3px;color:rgba(201,168,76,.4);text-transform:uppercase;padding:8px 8px 6px;margin-top:8px}
.cat-btn{
  width:100%;text-align:left;padding:9px 12px;border:none;background:none;
  color:rgba(240,232,213,.6);font-size:12px;font-weight:500;cursor:pointer;
  border-radius:8px;transition:.15s;display:flex;align-items:center;gap:8px;
}
.cat-btn:hover,.cat-btn:focus{background:rgba(201,168,76,.08);color:var(--gold)}
.cat-btn.active{background:linear-gradient(135deg,rgba(201,168,76,.18),rgba(201,168,76,.06));color:var(--gold);font-weight:700;border-left:3px solid var(--gold);padding-left:9px;}
.cat-btn.active{background:linear-gradient(135deg,rgba(201,168,76,.15),rgba(201,168,76,.05));color:var(--gold);font-weight:700;border-left:2px solid var(--gold)}

/* ── Menu Grid ─────────────────────────────────────────────── */
.menu-main{flex:1;overflow-y:auto;padding:16px}
.cat-section{margin-bottom:28px}
.cat-title{font-family:var(--font-display);font-size:20px;color:var(--text);margin-bottom:3px}
.cat-sub{font-size:11px;color:var(--muted);margin-bottom:12px}
.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.item-card{
  background:var(--bg2);border:1.5px solid var(--border);border-radius:12px;
  overflow:hidden;cursor:pointer;transition:.2s;
}
.item-card:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 4px 16px rgba(201,168,76,.15)}
.item-card.sig{border-color:rgba(201,168,76,.5)}
.item-img{width:100%;height:110px;object-fit:cover;background:var(--bg3);display:block}
.item-img-ph{
  width:100%;height:110px;display:flex;align-items:center;justify-content:center;
  font-size:32px;background:linear-gradient(135deg,#F5F0E5,#EDE5D5);
}
.sig-badge{background:var(--gold);color:#000;font-size:9px;font-weight:800;padding:3px 10px;letter-spacing:.5px;text-align:center}
.item-body{padding:10px}
.item-name{font-size:12px;font-weight:700;color:var(--text);margin-bottom:2px;line-height:1.3}
.item-sub{font-size:10px;color:var(--muted);margin-bottom:8px;line-height:1.4}
.item-footer{display:flex;align-items:center;justify-content:space-between}
.item-price{font-family:var(--font-display);font-size:15px;color:var(--gold);font-weight:700}
.btn-add{
  width:28px;height:28px;background:var(--gold);border:none;border-radius:8px;
  color:#000;font-size:18px;font-weight:900;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.15s;line-height:1;
}
.btn-add:hover{background:var(--gold-l);transform:scale(1.1)}

/* ── Cart Panel ────────────────────────────────────────────── */
.cart-panel{
  width:300px;flex-shrink:0;background:var(--dark);border-left:1px solid rgba(201,168,76,.15);
  display:flex;flex-direction:column;overflow:hidden;
}
.cart-header{
  padding:14px 16px;border-bottom:1px solid rgba(201,168,76,.15);
  display:flex;align-items:center;justify-content:space-between;
}
.cart-title{font-family:var(--font-display);font-size:14px;color:var(--gold);letter-spacing:2px}
.cart-clear{padding:4px 10px;background:transparent;border:1px solid rgba(201,168,76,.3);border-radius:8px;color:rgba(240,232,213,.5);font-size:10px;cursor:pointer}
.cart-clear:hover{border-color:var(--gold-d);color:var(--gold)}
.cart-items{flex:1;overflow-y:auto;padding:8px 0}
.cart-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:120px;color:rgba(240,232,213,.3);font-size:12px;gap:8px}
.cart-item{display:flex;align-items:center;padding:8px 14px;gap:10px;border-bottom:1px solid rgba(201,168,76,.06)}
.cart-item-name{flex:1;font-size:12px;color:rgba(240,232,213,.85);line-height:1.3}
.cart-item-price{font-family:'Playfair Display',serif;font-size:12px;color:var(--gold);flex-shrink:0}
.qty-ctrl{display:flex;align-items:center;gap:6px;flex-shrink:0}
.qty-btn{width:22px;height:22px;background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.2);border-radius:6px;color:var(--gold);font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.qty-btn:hover{background:rgba(201,168,76,.2)}
.qty-num{font-size:12px;color:rgba(240,232,213,.8);min-width:16px;text-align:center;font-weight:700}

/* ── Cart Footer ───────────────────────────────────────────── */
.cart-footer{padding:14px 16px;border-top:1px solid rgba(201,168,76,.15)}
.cart-totals{margin-bottom:12px}
.cart-row{display:flex;justify-content:space-between;font-size:11px;color:rgba(240,232,213,.55);margin-bottom:4px}
.cart-total-row{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid rgba(201,168,76,.15)}
.cart-total-label{font-size:12px;color:rgba(240,232,213,.7);letter-spacing:1px;text-transform:uppercase}
.cart-total-amount{font-family:var(--font-display);font-size:22px;color:var(--gold);font-weight:700}
.btn-order{
  width:100%;padding:13px;background:linear-gradient(135deg,var(--gold-d),var(--gold));
  border:none;border-radius:12px;color:#000;font-family:var(--font-display);
  font-size:15px;font-weight:700;cursor:pointer;letter-spacing:.5px;transition:.2s;
}
.btn-order:hover{background:linear-gradient(135deg,var(--gold),var(--gold-l));transform:translateY(-1px)}
.btn-order:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* ── Order Modal ───────────────────────────────────────────── */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);
  z-index:500;align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.open{display:flex!important;animation:fade-in .2s ease}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
.modal-box{
  background:#111;border:1px solid rgba(201,168,76,.35);border-radius:20px;
  padding:28px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;
}
.modal-title{font-family:var(--font-display);font-size:18px;color:var(--gold);letter-spacing:2px;margin-bottom:20px;text-align:center}
.field-group{margin-bottom:14px}
.field-label{font-size:11px;color:rgba(240,232,213,.5);margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase;display:block}
.field-input,.field-select,.field-textarea{
  width:100%;background:#1A1A1A;border:1px solid rgba(201,168,76,.2);border-radius:10px;
  color:#F0E8D5;padding:10px 14px;font-size:13px;outline:none;transition:.2s;
}
.field-input:focus,.field-select:focus,.field-textarea:focus{border-color:rgba(201,168,76,.5)}
.field-select option{background:#1A1A1A}
.field-textarea{resize:vertical;min-height:60px}
.pay-methods-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 6px;
}
.pay-method-btn{
  position:relative;padding:14px 8px 12px;background:#161616;
  border:2px solid rgba(201,168,76,.12);border-radius:14px;
  color:rgba(240,232,213,.55);font-size:11px;font-weight:700;
  cursor:pointer;text-align:center;transition:.2s;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  -webkit-tap-highlight-color:transparent;
}
.pay-method-btn .pay-icon{font-size:22px;line-height:1}
.pay-method-btn .pay-label{font-size:10px;letter-spacing:.3px;line-height:1.3}
.pay-method-btn:hover{border-color:rgba(201,168,76,.35);color:var(--gold);background:#1A1A1A}
.pay-method-btn.selected{
  border-color:var(--gold);background:rgba(201,168,76,.1);color:var(--gold);
  box-shadow:0 0 0 3px rgba(201,168,76,.12);
}
.pay-method-btn.selected::after{
  content:'✓';position:absolute;top:6px;right:8px;
  font-size:10px;font-weight:900;color:var(--gold);
}
/* Gift card code input */
.gift-card-field{
  display:none;margin-top:8px;margin-bottom:4px;
  animation:slide-in .2s ease;
}
@keyframes slide-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.gift-card-field.show{display:block}
.gift-card-input{
  width:100%;background:#1A1A1A;border:2px solid var(--gold);border-radius:10px;
  color:var(--gold);padding:11px 14px;font-size:14px;font-weight:700;
  outline:none;letter-spacing:2px;text-transform:uppercase;
  text-align:center;font-family:monospace;
}
.gift-card-input::placeholder{color:rgba(201,168,76,.3);letter-spacing:1px;font-size:12px}
.gift-card-hint{font-size:10px;color:rgba(201,168,76,.5);text-align:center;margin-top:5px;letter-spacing:.5px}
.modal-actions{display:flex;gap:8px;margin-top:4px}
.btn-cancel{flex:1;padding:12px;background:transparent;border:1px solid rgba(201,168,76,.2);border-radius:10px;color:rgba(240,232,213,.4);font-size:12px;cursor:pointer}
.btn-confirm{flex:2;padding:12px;background:linear-gradient(135deg,var(--gold-d),var(--gold));border:none;border-radius:10px;color:#000;font-size:13px;font-weight:800;cursor:pointer;letter-spacing:.5px}
.btn-confirm:disabled{opacity:.65;cursor:wait;transform:none}

/* ── Success Banner ────────────────────────────────────────── */
.success-banner{
  display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,#0D1A0D,#142014);
  border:1px solid rgba(46,204,113,.4);border-radius:14px;
  padding:14px 24px;color:#2ECC71;font-size:13px;font-weight:700;
  box-shadow:0 8px 32px rgba(0,0,0,.5);z-index:9000;text-align:center;
  animation:slide-up .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes slide-up{from{transform:translateX(-50%) translateY(60px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}

/* ── Toast ─────────────────────────────────────────────────── */
#toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(30px);
  background:#111;border:1px solid rgba(201,168,76,.4);border-radius:10px;
  padding:10px 20px;font-size:12px;color:#F0E8D5;z-index:9999;
  opacity:0;transition:.3s ease;pointer-events:none;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ══════════════════════════════════════════════════════════
   MOBILE — Full redesign (≤900px)
═════════════════════════════════════════════════════════════ */

.mobile-cats{display:none;position:fixed;top:var(--topbar-h);left:0;right:0;z-index:150;background:var(--dark);border-bottom:1px solid rgba(201,168,76,.15);overflow-x:auto;white-space:nowrap;padding:8px 10px;gap:6px;scrollbar-width:none;}
.mobile-cats::-webkit-scrollbar{display:none}
.mobile-cat-chip{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;background:rgba(255,255,255,.06);border:1px solid rgba(201,168,76,.15);border-radius:20px;font-size:11px;font-weight:600;color:rgba(240,232,213,.6);cursor:pointer;transition:.15s;flex-shrink:0;}
.mobile-cat-chip.active{background:rgba(201,168,76,.15);border-color:var(--gold);color:var(--gold);font-weight:700;}
.mobile-cta{display:none;position:fixed;bottom:0;left:0;right:0;z-index:200;background:linear-gradient(to top, var(--dark) 70%, transparent);padding:12px 16px 20px;}
.mobile-cta-btn{width:100%;padding:15px;background:linear-gradient(135deg,var(--gold-d),var(--gold));border:none;border-radius:14px;color:#000;font-family:var(--font-display);font-size:16px;font-weight:900;cursor:pointer;letter-spacing:.5px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 20px rgba(201,168,76,.35);transition:.2s;}

@media(max-width:900px){
  :root{--topbar-h:56px;--cats-h:50px;--cta-h:80px;--content-top:calc(var(--topbar-h) + var(--cats-h));}
  body{overflow:hidden}
  .topbar{height:var(--topbar-h);padding:0 12px;gap:8px;}
  .topbar-logo{font-size:16px;letter-spacing:2px;flex:1;text-align:center}
  .topbar-title{display:none}
  .btn-back{padding:6px 12px;font-size:10px;background:rgba(201,168,76,.08);}
  .cart-badge{width:28px;height:28px;font-size:12px;font-weight:900;box-shadow:0 2px 8px rgba(201,168,76,.4);}
  .mobile-cats{display:flex}
  .sidebar{display:none}
  .app-layout{flex-direction:column;padding-top:var(--content-top);height:100vh;overflow:hidden;}
  .menu-main{flex:1;overflow-y:auto;padding:12px 10px var(--cta-h) 10px;-webkit-overflow-scrolling:touch;}
  .cart-panel{display:none !important}
  .items-grid{grid-template-columns:repeat(2, 1fr);gap:10px;}
  .item-card{border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:.15s;}
  .item-card:active{transform:scale(.97)}
  .item-img,.item-img-ph{height:130px;border-radius:14px 14px 0 0;}
  .item-body{padding:10px 10px 12px}
  .item-name{font-size:12px;font-weight:700;line-height:1.35;margin-bottom:4px;}
  .item-sub{font-size:10px;line-height:1.4;margin-bottom:8px;}
  .item-price{font-size:15px}
  .btn-add{width:34px;height:34px;font-size:20px;border-radius:10px;}
  .mobile-cta{display:block}
  .modal-overlay{align-items:flex-end;padding:0;}
  .modal-box{border-radius:22px 22px 0 0;width:100%;max-width:100%;max-height:88vh;padding:20px 18px 28px;margin:0;}
  .modal-title{font-size:16px;margin-bottom:14px}
  .pay-methods-grid{grid-template-columns:repeat(3,1fr)}
  .success-banner{bottom:var(--cta-h);width:90%;font-size:12px;padding:12px 16px;}
  #toast{bottom:calc(var(--cta-h) + 12px)}
}
@media(max-width:380px){
  .items-grid{gap:7px}
  .item-img,.item-img-ph{height:110px}
  .mobile-cat-chip{font-size:10px;padding:5px 10px}
}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <button class="btn-back" onclick="window.location.href='../index.html'">← Accueil</button>
  <div class="topbar-logo">✦ LUX</div>
  <div class="topbar-title">Commander</div>
  <div style="display:flex;align-items:center;gap:6px;cursor:pointer;" onclick="openOrderModal()">
    <span style="color:rgba(240,232,213,.55);font-size:11px;letter-spacing:.5px" class="topbar-panier-lbl">Panier</span>
    <div class="cart-badge" id="cart-count">0</div>
  </div>
</div>

<div class="mobile-cats" id="mobile-cats-strip"></div>

<div class="app-layout">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-label">La Carte</div>
    <div id="cat-nav-list"></div>
  </nav>
  <main class="menu-main" id="menu-content"></main>
  <div class="cart-panel" id="cart-panel">
    <div class="cart-header"><span class="cart-title">✦ PANIER</span><button class="cart-clear" onclick="clearCart()">Vider</button></div>
    <div class="cart-items" id="cart-items"><div class="cart-empty"><span style="font-size:28px">🛒</span>Votre panier est vide</div></div>
    <div class="cart-footer" id="cart-footer" style="display:none">
      <div class="cart-totals"><div class="cart-row"><span>Sous-total</span><span id="cart-sub">0.00 DH</span></div><div class="cart-row"><span>TVA (10%)</span><span id="cart-tva">0.00 DH</span></div><div class="cart-total-row"><span class="cart-total-label">Total</span><span class="cart-total-amount" id="cart-total">0.00 DH</span></div></div>
      <button class="btn-order" onclick="openOrderModal()">Commander →</button>
    </div>
  </div>
</div>

<!-- ORDER MODAL -->
<div class="modal-overlay" id="order-modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-title">✦ Votre Commande</div>
    <div class="field-group"><label class="field-label">Nom du client *</label><input id="f-name" type="text" class="field-input" placeholder="Votre prénom..."></div>
    <div class="field-group"><label class="field-label">Téléphone (optionnel)</label><input id="f-phone" type="tel" class="field-input" placeholder="+212 6XX XXX XXX"></div>
    <div class="field-group"><label class="field-label">Type de commande</label><select id="f-type" class="field-select" onchange="toggleAddress()"><option value="table">Sur place (Table)</option><option value="takeaway">À emporter</option><option value="delivery">Livraison à domicile</option></select></div>
    <div class="field-group" id="f-addr-group" style="display:none"><label class="field-label">Adresse de livraison</label><input id="f-addr" type="text" class="field-input" placeholder="Votre adresse complète..."></div>
    <div class="field-group"><label class="field-label">Notes spéciales</label><textarea id="f-notes" class="field-textarea" placeholder="Allergies, préférences..."></textarea></div>
    <div class="field-label" style="margin-bottom:10px;color:rgba(240,232,213,.6)">Mode de paiement <span style="color:var(--red)">*</span></div>
    <div class="pay-methods-grid">
      <button class="pay-method-btn" type="button" data-pay="cash" onclick="selectPay(this)"><span class="pay-icon">💵</span><span class="pay-label">Espèces</span></button>
      <button class="pay-method-btn" type="button" data-pay="stripe" onclick="selectPay(this)"><span class="pay-icon">💳</span><span class="pay-label">Paiement en Ligne<br>(Carte / Google Pay)</span></button>
      <button class="pay-method-btn" type="button" data-pay="gift_card" onclick="selectPay(this)"><span class="pay-icon">🎁</span><span class="pay-label">Carte<br>Cadeau LUX</span></button>
    </div>
    <div class="gift-card-field" id="gift-card-field"><input type="text" id="f-gift-code" class="gift-card-input" placeholder="CODE-XXXX-XXXX" maxlength="20" autocomplete="off" oninput="this.value=this.value.toUpperCase()"><div class="gift-card-hint">✦ Entrez le code figurant sur votre carte cadeau LUX</div></div>
    <div class="modal-actions"><button class="btn-cancel" onclick="closeModal()">Annuler</button><button class="btn-confirm" id="confirm-order-btn" onclick="confirmOrder()">✦ Confirmer →</button></div>
  </div>
</div>

let cart = [];
let payMode = '';

function toast(msg) {
  let el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2500);
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;'); }

function buildMenu() {
  let nav = document.getElementById('cat-nav-list'), main = document.getElementById('menu-content'), navH='', mainH='';
  MENU.forEach((cat,i)=>{ navH+='<button class="cat-btn'+(i===0?' active':'')+'" onclick="scrollToCat(\''+cat.id+'\',this)">'+cat.icon+' '+cat.title+'</button>';
    mainH+='<div class="cat-section" id="cat-'+cat.id+'" style="display:'+(i===0?'block':'none')+'"><div class="cat-title">'+cat.icon+' '+cat.title+'</div>'+(cat.sub?'<div class="cat-sub">'+cat.sub+'</div>':'')+'<div class="items-grid">';
    cat.items.forEach(item=>{ let sigCls=item.sig?' sig':'';
      mainH+='<div class="item-card'+sigCls+'" onclick="addToCart(\''+esc(item.n)+'\','+item.p+')">'+(item.sig?'<div class="sig-badge">⭐ SIGNATURE</div>':'');
      if(item.img) mainH+='<img class="item-img" src="'+item.img+'" alt="'+item.n+'" loading="lazy" onerror="this.onerror=null;this.style.display=\'none\';var ph=this.nextElementSibling;if(ph)ph.style.display=\'flex\'"><div class="item-img-ph" style="display:none">'+cat.icon+'</div>';
      else mainH+='<div class="item-img-ph">'+cat.icon+'</div>';
      mainH+='<div class="item-body"><div class="item-name">'+item.n+'</div>'+(item.s?'<div class="item-sub">'+item.s+'</div>':'')+'<div class="item-footer"><div class="item-price">'+item.p+' DH</div><button class="btn-add" onclick="event.stopPropagation();addToCart(\''+esc(item.n)+'\','+item.p+')">+</button></div></div></div>';
    });
    mainH+='</div></div>';
  });
  nav.innerHTML=navH; main.innerHTML=mainH;
  let strip=document.getElementById('mobile-cats-strip'), chipsH='';
  MENU.forEach((cat,i)=>{ chipsH+='<button class="mobile-cat-chip'+(i===0?' active':'')+'" data-cat="'+cat.id+'" onclick="scrollToCatMobile(this.getAttribute(\'data-cat\'),this)">'+cat.icon+' '+cat.title+'</button>'; });
  if(strip) strip.innerHTML=chipsH;
}
function scrollToCat(id,btn){ document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active')); if(btn)btn.classList.add('active'); document.querySelectorAll('.mobile-cat-chip').forEach(b=>b.classList.toggle('active',b.getAttribute('data-cat')===id)); document.querySelectorAll('.cat-section').forEach(s=>s.style.display='none'); let el=document.getElementById('cat-'+id); if(el) el.style.display='block'; }
function scrollToCatMobile(id,btn){ document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active')); let sidebar_btn=document.querySelector('.cat-btn[data-cat="'+id+'"]'); if(sidebar_btn)sidebar_btn.classList.add('active'); document.querySelectorAll('.mobile-cat-chip').forEach(b=>b.classList.remove('active')); if(btn){btn.classList.add('active'); btn.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});} document.querySelectorAll('.cat-section').forEach(s=>s.style.display='none'); let el=document.getElementById('cat-'+id); if(el) el.style.display='block'; }
function addToCart(name,price){ let ex=cart.find(c=>c.n===name); if(ex)ex.q++; else cart.push({n:name,p:price,q:1}); renderCart(); toast('✓ '+name+' ajouté'); }
function changeQty(name,delta){ let ex=cart.find(c=>c.n===name); if(!ex)return; ex.q+=delta; if(ex.q<=0) cart=cart.filter(c=>c.n!==name); renderCart(); }
function clearCart(){ cart=[]; renderCart(); }
function renderCart(){ let itemsEl=document.getElementById('cart-items'), footerEl=document.getElementById('cart-footer'), countEl=document.getElementById('cart-count'), count=cart.reduce((s,c)=>s+c.q,0); countEl.textContent=count; if(!cart.length){ itemsEl.innerHTML='<div class="cart-empty"><span style="font-size:28px">🛒</span>Votre panier est vide</div>'; footerEl.style.display='none'; return; } footerEl.style.display='block'; let h=''; cart.forEach(c=>{ h+='<div class="cart-item"><div class="cart-item-name">'+c.n+'</div><div class="qty-ctrl"><button class="qty-btn" onclick="changeQty(\''+esc(c.n)+'\',-1)">−</button><span class="qty-num">'+c.q+'</span><button class="qty-btn" onclick="changeQty(\''+esc(c.n)+'\',1)">+</button></div><div class="cart-item-price">'+(c.p*c.q).toFixed(2)+' DH</div></div>'; }); itemsEl.innerHTML=h; let sub=cart.reduce((s,c)=>s+c.p*c.q,0), tva=sub*0.1, total=sub+tva; document.getElementById('cart-sub').textContent=sub.toFixed(2)+' DH'; document.getElementById('cart-tva').textContent=tva.toFixed(2)+' DH'; document.getElementById('cart-total').textContent=total.toFixed(2)+' DH'; let mobileTotal=document.getElementById('mobile-cta-total'); if(mobileTotal) mobileTotal.textContent=total.toFixed(2)+' DH'; }

function openOrderModal(){ if(!cart.length){ toast('⚠ Panier vide'); return; } document.getElementById('order-modal').classList.add('open'); }
function closeModal(){ document.getElementById('order-modal').classList.remove('open'); payMode=''; document.querySelectorAll('.pay-method-btn').forEach(b=>b.classList.remove('selected')); document.getElementById('gift-card-field').classList.remove('show'); let gcInp=document.getElementById('f-gift-code'); if(gcInp) gcInp.value=''; let confirmBtn=document.getElementById('confirm-order-btn'); if(confirmBtn){ confirmBtn.disabled=false; confirmBtn.innerHTML='✦ Confirmer →'; } }
function toggleAddress(){ document.getElementById('f-addr-group').style.display=document.getElementById('f-type').value==='delivery'?'block':'none'; }
function selectPay(btn){ document.querySelectorAll('.pay-method-btn').forEach(b=>b.classList.remove('selected')); btn.classList.add('selected'); payMode=btn.getAttribute('data-pay'); let gcField=document.getElementById('gift-card-field'); if(gcField){ if(payMode==='gift_card'){ gcField.classList.add('show'); setTimeout(()=>{ let inp=document.getElementById('f-gift-code'); if(inp)inp.focus(); },150); } else { gcField.classList.remove('show'); let inp=document.getElementById('f-gift-code'); if(inp)inp.value=''; } } }

async function confirmOrder(){
  let name=document.getElementById('f-name').value.trim(), phone=document.getElementById('f-phone').value.trim(), type=document.getElementById('f-type').value, addr=document.getElementById('f-addr').value.trim(), notes=document.getElementById('f-notes').value.trim(), giftCode=document.getElementById('f-gift-code')?document.getElementById('f-gift-code').value.trim().toUpperCase():'';
  if(!name){ toast('⚠ Entrez votre prénom'); return; }
  if(!payMode){ document.querySelectorAll('.pay-method-btn').forEach(b=>{ b.style.borderColor='rgba(231,76,60,.6)'; setTimeout(()=>{ b.style.borderColor=''; },1000); }); toast('⚠ Choisissez un mode de paiement'); return; }
  if(payMode==='gift_card' && !giftCode){ let gcInput=document.getElementById('f-gift-code'); if(gcInput){ gcInput.style.borderColor='var(--red)'; gcInput.focus(); setTimeout(()=>{ gcInput.style.borderColor='var(--gold)'; },1000); } toast('⚠ Entrez le code de votre carte cadeau'); return; }
  if(type==='delivery' && !addr){ toast('⚠ Entrez votre adresse'); return; }

  let sub=cart.reduce((s,c)=>s+c.p*c.q,0), tva=+(sub*0.1).toFixed(2), total=+(sub+tva).toFixed(2);
  let apiItems=cart.map(c=>({name:c.n,price:c.p,qty:c.q}));
  let posNote=notes; if(payMode==='stripe') posNote='💳 Paiement en ligne (Stripe)'+(notes?' — '+notes:''); else if(payMode==='gift_card') posNote='🎁 Carte Cadeau: '+giftCode+(notes?' — '+notes:''); else if(payMode==='cash') posNote='💵 Espèces'+(notes?' — '+notes:'');

  // 🚀 STRIPE LOGIC (paiement en ligne)
  if(payMode === 'stripe') {
    if(!stripeInstance) { toast('⚠️ Service de paiement indisponible. Réessayez.'); return; }
    let confirmBtn=document.getElementById('confirm-order-btn');
    let originalText=confirmBtn.innerHTML;
    confirmBtn.disabled=true;
    confirmBtn.innerHTML='⏳ Redirection vers le paiement sécurisé...';

    let orderPayload = {
      source: 'web',
      type: type,
      address: addr,
      notes: posNote,
      payMethod: 'stripe',
      giftCardCode: null,
      table: detectTableNum(),
      items: apiItems,
      subtotal: sub,
      total: total,
      customer: { name: name, phone: phone },
      success_url: window.location.origin + window.location.pathname + '?payment_success=true',
      cancel_url: window.location.origin + window.location.pathname + '?payment_cancel=true'
    };

    let apiBase = window.LUX_API_URL || 'https://cafeslux-api-production.up.railway.app';
    try {
      const response = await fetch(apiBase + '/api/stripe/create-checkout-session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(orderPayload),
      });
      const data = await response.json();
      
      if(data.sessionId || data.id) {
        let sessionId = data.sessionId || data.id;
        const result = await stripeInstance.redirectToCheckout({ sessionId: sessionId });
        if (result && result.error) throw new Error(result.error.message);
      } else if(data.url) {
        window.location.href = data.url;
      } else {
        throw new Error('Réponse invalide du serveur');
      }
    } catch(err) {
      console.error('Stripe error:', err);
      toast('❌ Erreur paiement: ' + err.message);
      confirmBtn.disabled=false;
      confirmBtn.innerHTML=originalText;
    }
    return; // on arrête ici, on ne passe pas par l'API classique.
  }

  // ── CAS ESPÈCES / CARTE CADEAU (ancien flux direct) ─────────
  let order = { source:'web', type, address:addr, notes:posNote, payMethod:payMode, giftCardCode:payMode==='gift_card'?giftCode:null, table:detectTableNum(), items:apiItems, subtotal:sub, total:total, customer:{name,phone} };
  let confirmBtn=document.getElementById('confirm-order-btn');
  confirmBtn.textContent='Envoi...';
  confirmBtn.disabled=true;
  let API=window.LUX_API_URL||'https://cafeslux-api-production.up.railway.app';
  fetch(API+'/api/orders',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(order)})
    .then(r=>r.json()).then(res=>{ showSuccess(name,res.ref||res.id||(res.order&&res.order.id)); })
    .catch(()=>{ showSuccess(name,'LX-'+String(Date.now()).slice(-6)); });
}

function showSuccess(name,ref){ closeModal(); cart=[]; renderCart(); let el=document.getElementById('success-banner'); let refStr=ref?' #'+String(ref).slice(-6):''; el.innerHTML='✅ Votre commande'+refStr+' a été envoyée avec succès au comptoir!<br><span style="font-size:11px;opacity:.8">Merci '+name+' — prête dans quelques minutes ✦</span>'; el.style.display='block'; let confirmBtn=document.getElementById('confirm-order-btn'); if(confirmBtn){ confirmBtn.disabled=false; confirmBtn.innerHTML='✦ Confirmer →'; } setTimeout(()=>{ el.style.display='none'; },5000); }

function detectTableNum(){ let p=new URLSearchParams(window.location.search); return p.get('table')||p.get('table_id')||p.get('qr')||null; }
function detectTable(){ let p=new URLSearchParams(window.location.search); let table=p.get('table')||p.get('table_id')||p.get('qr'); if(table){ let el=document.querySelector('.topbar-title'); if(el) el.textContent='Table '+table+' — Commander'; let sel=document.getElementById('f-type'); if(sel){ sel.value='table'; sel.disabled=true; } } }

document.addEventListener('DOMContentLoaded',()=>{ buildMenu(); renderCart(); detectTable(); });
</script>
</body>
</html>
