<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script>
(function () {
  'use strict';
  var loc    = window.location;
  var path   = loc.pathname;
  var search = loc.search;
  var hash   = loc.hash;

  // STOP 1: URL already has ?p= → loop detected → go to clean root
  if (search.indexOf('p=') !== -1) {
    loc.replace(loc.origin + '/');
    return;
  }
  // STOP 2: path is "/" → index.html not at root → redirect to /public/
  if (path === '/' || path === '') {
    loc.replace(loc.origin + '/public/');
    return;
  }
  // STOP 3: already in /public/ → genuine 404
  if (path.indexOf('/public/') === 0) {
    document.write('<style>body{background:#0d0d0d;color:#C9A84C;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}</style><div style="text-align:center"><div style="font-size:40px;margin-bottom:16px">✦</div><div>Page introuvable</div><br><a href="/public/" style="color:#C9A84C">Retour à l\'accueil</a></div>');
    return;
  }
  // NORMAL: SPA deep-link → redirect once to /public/?p=path
  loc.replace(loc.origin + '/public/?p=' + encodeURIComponent(path + search + hash));
}());
</script>
</head>
<body></body>
</html>
