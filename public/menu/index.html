<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#C9A84C">
<title>CAFÉ LUX — Commander</title>

<!-- ── API Config ──────────────────────────────────────────── -->
<script>window.LUX_API_URL = 'https://cafeslux-api-production.up.railway.app';</script>

<!-- ── Fonts ───────────────────────────────────────────────── -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
/* ── Design Tokens ─────────────────────────────────────────── */
:root{
  --gold:#C9A84C;--gold-l:#E8C97A;--gold-d:#8B6E2F;
  --bg:#F9F5EE;--bg2:#FFFFFF;--bg3:#F0EAD9;
  --dark:#080808;--text:#1A0A00;--muted:#888;
  --border:rgba(201,168,76,.25);--border2:rgba(201,168,76,.5);
  --green:#2ECC71;--red:#E74C3C;
  --font-display:'Playfair Display',serif;
  --font-body:'DM Sans',sans-serif;
  --font-it:'Cormorant Garamond',serif;
  --topbar-h:60px;--sidebar-w:220px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;-webkit-font-smoothing:antialiased}
body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body);overflow:hidden}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
input,button,select,textarea{font-family:inherit}

/* ── Topbar ────────────────────────────────────────────────── */
.topbar{
  height:var(--topbar-h);background:var(--dark);
  display:flex;align-items:center;padding:0 16px;gap:12px;
  position:fixed;top:0;left:0;right:0;z-index:200;
  border-bottom:2px solid var(--gold-d);
}
.topbar-logo{font-family:var(--font-display);color:var(--gold);font-size:18px;letter-spacing:3px;flex:1}
.topbar-title{font-size:12px;color:rgba(240,232,213,.6);letter-spacing:2px;text-transform:uppercase}
.btn-back{
  padding:7px 16px;background:transparent;border:1px solid rgba(201,168,76,.4);
  border-radius:20px;color:var(--gold);font-size:11px;font-weight:600;cursor:pointer;
  letter-spacing:.5px;transition:.2s;
}
.btn-back:hover{background:rgba(201,168,76,.1)}
.cart-badge{
  background:var(--gold);color:#000;border-radius:50%;width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;
  margin-left:8px;cursor:pointer;transition:.2s;
}
.cart-badge:hover{transform:scale(1.1)}

/* ── Layout (3-column SaaS: top categories · grid · right cart) ── */
.app-layout{
  display:grid;
  grid-template-columns:1fr 300px;
  grid-template-rows:auto 1fr;
  grid-template-areas:"cats cart" "main cart";
  height:100vh;padding-top:var(--topbar-h);
}

/* ── Categories: horizontal scrollable pill bar (was vertical sidebar) ── */
.sidebar{
  grid-area:cats;
  display:flex;align-items:center;gap:8px;
  width:auto;background:var(--dark);
  overflow-x:auto;overflow-y:hidden;white-space:nowrap;
  padding:11px 16px;border-right:none;border-bottom:1px solid rgba(201,168,76,.15);
  scrollbar-width:thin;
}
.sidebar::-webkit-scrollbar{height:6px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(201,168,76,.3);border-radius:6px}
.sidebar-label{font-size:9px;letter-spacing:3px;color:rgba(201,168,76,.4);text-transform:uppercase;
  padding:0 8px 0 2px;margin:0;flex-shrink:0}
#cat-nav-list{display:flex;gap:7px;align-items:center}
.cat-btn{
  width:auto;flex-shrink:0;white-space:nowrap;text-align:center;padding:9px 16px;
  border:1px solid rgba(201,168,76,.15);background:rgba(255,255,255,.04);
  color:rgba(240,232,213,.6);font-size:12px;font-weight:600;cursor:pointer;
  border-radius:30px;transition:.15s;display:inline-flex;align-items:center;gap:7px;
}
.cat-btn:hover,.cat-btn:focus{background:rgba(201,168,76,.1);color:var(--gold);border-color:rgba(201,168,76,.4)}
.cat-btn.active{background:rgba(201,168,76,.16);color:var(--gold);font-weight:700;
  border:1px solid var(--gold);border-left:1px solid var(--gold);padding:9px 16px}

/* ── Menu Grid ─────────────────────────────────────────────── */
.menu-main{grid-area:main;overflow-y:auto;padding:16px}
.cat-section{margin-bottom:28px}
.cat-title{font-family:var(--font-display);font-size:20px;color:var(--text);margin-bottom:3px}
.cat-sub{font-size:11px;color:var(--muted);margin-bottom:12px}
.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.item-card{
  background:var(--bg2);border:1.5px solid var(--border);border-radius:12px;
  overflow:hidden;cursor:pointer;transition:.2s;
}
.item-card:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 4px 16px rgba(201,168,76,.15)}
.item-card.sig{border-color:rgba(201,168,76,.5)}
.item-img{width:100%;height:110px;object-fit:cover;background:var(--bg3);display:block}
.item-img-ph{
  width:100%;height:110px;display:flex;align-items:center;justify-content:center;
  font-size:32px;background:linear-gradient(135deg,#F5F0E5,#EDE5D5);
}
.sig-badge{background:var(--gold);color:#000;font-size:9px;font-weight:800;padding:3px 10px;letter-spacing:.5px;text-align:center}
.item-body{padding:10px}
.item-name{font-size:12px;font-weight:700;color:var(--text);margin-bottom:2px;line-height:1.3}
.item-sub{font-size:10px;color:var(--muted);margin-bottom:8px;line-height:1.4}
.item-footer{display:flex;align-items:center;justify-content:space-between}
.item-price{font-family:var(--font-display);font-size:15px;color:var(--gold);font-weight:700}
.btn-add{
  width:28px;height:28px;background:var(--gold);border:none;border-radius:8px;
  color:#000;font-size:18px;font-weight:900;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.15s;line-height:1;
}
.btn-add:hover{background:var(--gold-l);transform:scale(1.1)}

/* ── Cart Panel ────────────────────────────────────────────── */
.cart-panel{
  grid-area:cart;
  width:300px;flex-shrink:0;background:var(--dark);border-left:1px solid rgba(201,168,76,.15);
  display:flex;flex-direction:column;overflow:hidden;
}
.cart-header{
  padding:14px 16px;border-bottom:1px solid rgba(201,168,76,.15);
  display:flex;align-items:center;justify-content:space-between;
}
.cart-title{font-family:var(--font-display);font-size:14px;color:var(--gold);letter-spacing:2px}
.cart-clear{padding:4px 10px;background:transparent;border:1px solid rgba(201,168,76,.3);border-radius:8px;color:rgba(240,232,213,.5);font-size:10px;cursor:pointer}
.cart-clear:hover{border-color:var(--gold-d);color:var(--gold)}
.cart-items{flex:1;overflow-y:auto;padding:8px 0}
.cart-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:120px;color:rgba(240,232,213,.3);font-size:12px;gap:8px}
.cart-item{display:flex;align-items:center;padding:8px 14px;gap:10px;border-bottom:1px solid rgba(201,168,76,.06)}
.cart-item-name{flex:1;font-size:12px;color:rgba(240,232,213,.85);line-height:1.3}
.cart-item-price{font-family:'Playfair Display',serif;font-size:12px;color:var(--gold);flex-shrink:0}
.qty-ctrl{display:flex;align-items:center;gap:6px;flex-shrink:0}
.qty-btn{width:22px;height:22px;background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.2);border-radius:6px;color:var(--gold);font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.qty-btn:hover{background:rgba(201,168,76,.2)}
.qty-num{font-size:12px;color:rgba(240,232,213,.8);min-width:16px;text-align:center;font-weight:700}

/* ── Cart Footer ───────────────────────────────────────────── */
.cart-footer{padding:14px 16px;border-top:1px solid rgba(201,168,76,.15)}
.cart-totals{margin-bottom:12px}
.cart-row{display:flex;justify-content:space-between;font-size:11px;color:rgba(240,232,213,.55);margin-bottom:4px}
.cart-total-row{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid rgba(201,168,76,.15)}
.cart-total-label{font-size:12px;color:rgba(240,232,213,.7);letter-spacing:1px;text-transform:uppercase}
.cart-total-amount{font-family:var(--font-display);font-size:22px;color:var(--gold);font-weight:700}
.btn-order{
  width:100%;padding:13px;background:linear-gradient(135deg,var(--gold-d),var(--gold));
  border:none;border-radius:12px;color:#000;font-family:var(--font-display);
  font-size:15px;font-weight:700;cursor:pointer;letter-spacing:.5px;transition:.2s;
}
.btn-order:hover{background:linear-gradient(135deg,var(--gold),var(--gold-l));transform:translateY(-1px)}
.btn-order:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* ── Order Modal ───────────────────────────────────────────── */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);
  z-index:500;align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.open{display:flex!important;animation:fade-in .2s ease}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
.modal-box{
  background:#111;border:1px solid rgba(201,168,76,.35);border-radius:20px;
  padding:28px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;
}
.modal-title{font-family:var(--font-display);font-size:18px;color:var(--gold);letter-spacing:2px;margin-bottom:20px;text-align:center}
.field-group{margin-bottom:14px}
.field-label{font-size:11px;color:rgba(240,232,213,.5);margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase;display:block}
.field-input,.field-select,.field-textarea{
  width:100%;background:#1A1A1A;border:1px solid rgba(201,168,76,.2);border-radius:10px;
  color:#F0E8D5;padding:10px 14px;font-size:13px;outline:none;transition:.2s;
}
.field-input:focus,.field-select:focus,.field-textarea:focus{border-color:rgba(201,168,76,.5)}
.field-select option{background:#1A1A1A}
.field-textarea{resize:vertical;min-height:60px}
.pay-methods-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 6px;
}
.pay-method-btn{
  position:relative;padding:14px 8px 12px;background:#161616;
  border:2px solid rgba(201,168,76,.12);border-radius:14px;
  color:rgba(240,232,213,.55);font-size:11px;font-weight:700;
  cursor:pointer;text-align:center;transition:.2s;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  -webkit-tap-highlight-color:transparent;
}
.pay-method-btn .pay-icon{font-size:22px;line-height:1}
.pay-method-btn .pay-label{font-size:10px;letter-spacing:.3px;line-height:1.3}
.pay-method-btn:hover{border-color:rgba(201,168,76,.35);color:var(--gold);background:#1A1A1A}
.pay-method-btn.selected{
  border-color:var(--gold);background:rgba(201,168,76,.1);color:var(--gold);
  box-shadow:0 0 0 3px rgba(201,168,76,.12);
}
.pay-method-btn.selected::after{
  content:'✓';position:absolute;top:6px;right:8px;
  font-size:10px;font-weight:900;color:var(--gold);
}
/* Gift card code input */
.gift-card-field{
  display:none;margin-top:8px;margin-bottom:4px;
  animation:slide-in .2s ease;
}
@keyframes slide-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.gift-card-field.show{display:block}
.gift-card-input{
  width:100%;background:#1A1A1A;border:2px solid var(--gold);border-radius:10px;
  color:var(--gold);padding:11px 14px;font-size:14px;font-weight:700;
  outline:none;letter-spacing:2px;text-transform:uppercase;
  text-align:center;font-family:monospace;
}
.gift-card-input::placeholder{color:rgba(201,168,76,.3);letter-spacing:1px;font-size:12px}
.gift-card-hint{font-size:10px;color:rgba(201,168,76,.5);text-align:center;margin-top:5px;letter-spacing:.5px}
.modal-actions{display:flex;gap:8px;margin-top:4px}
.btn-cancel{flex:1;padding:12px;background:transparent;border:1px solid rgba(201,168,76,.2);border-radius:10px;color:rgba(240,232,213,.4);font-size:12px;cursor:pointer}
.btn-confirm{flex:2;padding:12px;background:linear-gradient(135deg,var(--gold-d),var(--gold));border:none;border-radius:10px;color:#000;font-size:13px;font-weight:800;cursor:pointer;letter-spacing:.5px}
.btn-confirm:hover{background:linear-gradient(135deg,var(--gold),var(--gold-l))}

/* ── Success Banner ────────────────────────────────────────── */
.success-banner{
  display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,#0D1A0D,#142014);
  border:1px solid rgba(46,204,113,.4);border-radius:14px;
  padding:14px 24px;color:#2ECC71;font-size:13px;font-weight:700;
  box-shadow:0 8px 32px rgba(0,0,0,.5);z-index:9000;text-align:center;
  animation:slide-up .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes slide-up{from{transform:translateX(-50%) translateY(60px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}

/* ── Toast ─────────────────────────────────────────────────── */
#toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(30px);
  background:#111;border:1px solid rgba(201,168,76,.4);border-radius:10px;
  padding:10px 20px;font-size:12px;color:#F0E8D5;z-index:9999;
  opacity:0;transition:.3s ease;pointer-events:none;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ══════════════════════════════════════════════════════════
   MOBILE — Full redesign (≤900px)
   Architecture:
     - Topbar: ← Back | ✦ LUX | [🛒 N articles]
     - Category tabs: horizontal scroll bar under topbar
     - Content: full-width 2-col cards
     - Bottom CTA: sticky COMMANDER button
   ══════════════════════════════════════════════════════════ */

/* ── Mobile category tabs strip ──────────────────────────── */
.mobile-cats{
  display:none;
  position:fixed;top:var(--topbar-h);left:0;right:0;z-index:150;
  background:var(--dark);border-bottom:1px solid rgba(201,168,76,.15);
  overflow-x:auto;white-space:nowrap;padding:8px 10px;gap:6px;
  scrollbar-width:none;
}
.mobile-cats::-webkit-scrollbar{display:none}
.mobile-cat-chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:6px 14px;background:rgba(255,255,255,.06);
  border:1px solid rgba(201,168,76,.15);border-radius:20px;
  font-size:11px;font-weight:600;color:rgba(240,232,213,.6);
  cursor:pointer;transition:.15s;flex-shrink:0;
}
.mobile-cat-chip:hover{border-color:rgba(201,168,76,.4);color:var(--gold)}
.mobile-cat-chip.active{
  background:rgba(201,168,76,.15);border-color:var(--gold);
  color:var(--gold);font-weight:700;
}

/* ── Sticky Commander CTA ─────────────────────────────────── */
.mobile-cta{
  display:none;
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:linear-gradient(to top, var(--dark) 70%, transparent);
  padding:12px 16px 20px;
}
.mobile-cta-btn{
  width:100%;padding:15px;
  background:linear-gradient(135deg,var(--gold-d),var(--gold));
  border:none;border-radius:14px;color:#000;
  font-family:var(--font-display);font-size:16px;font-weight:900;
  cursor:pointer;letter-spacing:.5px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 4px 20px rgba(201,168,76,.35);
  transition:.2s;
}
.mobile-cta-btn:active{transform:scale(.98)}
.mobile-cta-left{display:flex;align-items:center;gap:10px}
.mobile-cta-icon{font-size:20px}
.mobile-cta-text{font-size:15px}
.mobile-cta-badge{
  background:#000;color:var(--gold);
  border-radius:20px;padding:4px 12px;
  font-size:13px;font-weight:900;
}

@media(max-width:900px){

  /* Variables */
  :root{
    --topbar-h: 56px;
    --cats-h:   50px;
    --cta-h:    80px;
    --content-top: calc(var(--topbar-h) + var(--cats-h));
  }

  /* body overflow fix */
  body{ overflow:hidden }

  /* ── Topbar mobile ──────────────────────────────────────── */
  .topbar{
    height:var(--topbar-h);
    padding:0 12px;gap:8px;
  }
  .topbar-logo{ font-size:16px; letter-spacing:2px; flex:1; text-align:center }
  .topbar-title{ display:none }
  .btn-back{
    padding:6px 12px;font-size:10px;
    background:rgba(201,168,76,.08);
  }

  /* Cart badge in topbar → bigger, more visible */
  .cart-badge{
    width:28px;height:28px;font-size:12px;font-weight:900;
    box-shadow:0 2px 8px rgba(201,168,76,.4);
  }

  /* ── Category tabs strip ───────────────────────────────── */
  .mobile-cats{ display:flex }
  .sidebar{ display:none }

  /* ── Layout ────────────────────────────────────────────── */
  .app-layout{
    display:block;
    flex-direction:column;
    padding-top:var(--content-top);
    height:100vh;
    overflow:hidden;
  }

  /* ── Menu main full width ──────────────────────────────── */
  .menu-main{
    flex:1;
    overflow-y:auto;
    padding:12px 10px var(--cta-h) 10px;
    -webkit-overflow-scrolling:touch;
  }

  /* ── Cart hidden (desktop panel) ──────────────────────── */
  .cart-panel{ display:none !important }

  /* ── Product cards — 2-col premium ───────────────────── */
  .items-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:10px;
  }
  .item-card{
    border-radius:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    transition:.15s;
  }
  .item-card:active{ transform:scale(.97) }
  .item-img,.item-img-ph{
    height:130px;
    border-radius:14px 14px 0 0;
  }
  .item-img{ object-position:center top }
  .item-body{ padding:10px 10px 12px }
  .item-name{
    font-size:12px;font-weight:700;
    line-height:1.35;margin-bottom:4px;
    display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden;
  }
  .item-sub{
    font-size:10px;line-height:1.4;margin-bottom:8px;
    display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden;
  }
  .item-price{ font-size:15px }
  .btn-add{
    width:34px;height:34px;font-size:20px;
    border-radius:10px;
    box-shadow:0 2px 6px rgba(201,168,76,.3);
  }
  .sig-badge{ font-size:8px;padding:2px 8px }
  .cat-title{ font-size:18px }

  /* ── COMMANDER sticky CTA ─────────────────────────────── */
  .mobile-cta{ display:block }

  /* ── Modal full-height bottom sheet ──────────────────── */
  .modal-overlay{
    align-items:flex-end;
    padding:0;
  }
  .modal-box{
    border-radius:22px 22px 0 0;
    width:100%;max-width:100%;
    max-height:88vh;
    padding:20px 18px 28px;
    margin:0;
  }
  .modal-title{ font-size:16px;margin-bottom:14px }
  /* Gift card input on mobile */
  .pay-methods-grid{ grid-template-columns:repeat(3,1fr) }
  .gift-card-input{ font-size:16px;padding:13px 14px }

  /* ── Success banner ───────────────────────────────────── */
  .success-banner{
    bottom:var(--cta-h);
    width:90%;
    font-size:12px;
    padding:12px 16px;
  }

  /* ── Toast above CTA ──────────────────────────────────── */
  #toast{ bottom:calc(var(--cta-h) + 12px) }
}

/* Extra small phones */
@media(max-width:380px){
  .items-grid{ gap:7px }
  .item-img,.item-img-ph{ height:110px }
  .mobile-cat-chip{ font-size:10px;padding:5px 10px }
}

</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════
     TOPBAR
════════════════════════════════════════════════════════════ -->
<div class="topbar">
  <button class="btn-back" onclick="window.location.href='../index.html'">← Accueil</button>
  <div class="topbar-logo">✦ LUX</div>
  <div class="topbar-title">Commander</div>
  <div style="display:flex;align-items:center;gap:6px;cursor:pointer;-webkit-tap-highlight-color:transparent" onclick="openOrderModal()">
    <span style="color:rgba(240,232,213,.55);font-size:11px;letter-spacing:.5px" class="topbar-panier-lbl">Panier</span>
    <div class="cart-badge" id="cart-count">0</div>
  </div>
</div>

<!-- Mobile category chips strip -->
<div class="mobile-cats" id="mobile-cats-strip"></div>

<!-- ═══════════════════════════════════════════════════════════
     MAIN LAYOUT
════════════════════════════════════════════════════════════ -->
<div class="app-layout">

  <!-- Sidebar: category navigation -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-label">La Carte</div>
    <div id="cat-nav-list"></div>
  </nav>

  <!-- Menu grid -->

// ── Cart State ────────────────────────────────────────────────
var cart    = [];
var payMode = '';  // '' = not selected yet

// ── Utility ───────────────────────────────────────────────────
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(function() { el.classList.remove('show'); }, 2500);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;');
}

function today() {
  return new Date().toISOString().slice(0,10);
}

function nowTime() {
  return new Date().toLocaleTimeString('fr-MA',{hour:'2-digit',minute:'2-digit'});
}

// ── Build menu DOM ────────────────────────────────────────────
function buildMenu() {
  var nav  = document.getElementById('cat-nav-list');
  var main = document.getElementById('menu-content');
  var navH = '', mainH = '';

  MENU.forEach(function(cat, i) {
    navH += '<button class="cat-btn' + (i===0?' active':'') + '"' +
            ' onclick="scrollToCat(\'' + cat.id + '\',this)">' +
            cat.icon + ' ' + cat.title + '</button>';

    mainH += '<div class="cat-section" id="cat-' + cat.id + '" style="display:' + (i===0?'block':'none') + '">';
    mainH += '<div class="cat-title">' + cat.icon + ' ' + cat.title + '</div>';
    if (cat.sub) mainH += '<div class="cat-sub">' + cat.sub + '</div>';
    mainH += '<div class="items-grid">';

    cat.items.forEach(function(item) {
      var sigCls = item.sig ? ' sig' : '';
      mainH += '<div class="item-card' + sigCls + '" onclick="addToCart(\'' + esc(item.n) + '\',' + item.p + ')">';
      if (item.sig) mainH += '<div class="sig-badge">⭐ SIGNATURE</div>';
      if (item.img) {
      var imgEl = document.createElement('img');
      imgEl.className = 'item-img';
      imgEl.src = item.img.startsWith('http') ? item.img : item.img;
      imgEl.alt = item.n;
      imgEl.loading = 'lazy';
      imgEl.setAttribute('data-fallback', cat.icon);
      mainH += '<img class="item-img" src="' + item.img + '" alt="' + item.n + '" loading="lazy" ' +
               'onerror="this.onerror=null;this.style.display=\'none\';var ph=this.nextElementSibling;if(ph)ph.style.display=\'flex\'">';
      mainH += '<div class="item-img-ph" style="display:none">' + cat.icon + '</div>';
    } else {
      mainH += '<div class="item-img-ph">' + cat.icon + '</div>';
    }
      mainH += '<div class="item-body">';
      mainH += '<div class="item-name">' + item.n + '</div>';
      if (item.s) mainH += '<div class="item-sub">' + item.s + '</div>';
      mainH += '<div class="item-footer">';
      mainH += '<div class="item-price">' + item.p + ' DH</div>';
      mainH += '<button class="btn-add" onclick="event.stopPropagation();addToCart(\'' + esc(item.n) + '\',' + item.p + ')">+</button>';
      mainH += '</div></div></div>';
    });

    mainH += '</div></div>';
  });

  nav.innerHTML  = navH;
  main.innerHTML = mainH;

  // Build mobile category chips strip
  var strip = document.getElementById('mobile-cats-strip');
  if (strip) {
        var chipsH = '';
    MENU.forEach(function(cat, i) {
      var isActive = i === 0 ? ' active' : '';
      chipsH += '<button class="mobile-cat-chip' + isActive + '" data-cat="' + cat.id + '" onclick="scrollToCatMobile(this.getAttribute(\'data-cat\'),this)">' + cat.icon + ' ' + cat.title + '</button>';
    });
    strip.innerHTML = chipsH;
  }
}

function scrollToCat(id, btn) {
  document.querySelectorAll('.cat-btn').forEach(function(b) { b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  // Sync mobile chips
  document.querySelectorAll('.mobile-cat-chip').forEach(function(b) {
    b.classList.toggle('active', b.getAttribute('data-cat') === id);
  });
  // Show only selected section
  document.querySelectorAll('.cat-section').forEach(function(s) { s.style.display = 'none'; });
  var el = document.getElementById('cat-' + id);
  if (el) {
    el.style.display = 'block';
    var mc = document.getElementById('menu-content');
    if (mc) mc.scrollTop = 0;
  }
}

function scrollToCatMobile(id, btn) {
  // Update desktop sidebar buttons
  document.querySelectorAll('.cat-btn').forEach(function(b) { b.classList.remove('active'); });
  var sidebar_btn = document.querySelector('.cat-btn[data-cat="' + id + '"]');
  if (sidebar_btn) sidebar_btn.classList.add('active');
  // Update chips
  document.querySelectorAll('.mobile-cat-chip').forEach(function(b) { b.classList.remove('active'); });
  if (btn) {
    btn.classList.add('active');
    // Scroll chip into view
    btn.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
  }
  // Show only selected section
  document.querySelectorAll('.cat-section').forEach(function(s) { s.style.display = 'none'; });
  var el = document.getElementById('cat-' + id);
  if (el) {
    el.style.display = 'block';
    var mc = document.getElementById('menu-content');
    if (mc) mc.scrollTop = 0;
  }
}

// ── Cart Logic ────────────────────────────────────────────────
function addToCart(name, price) {
  var ex = cart.find(function(c) { return c.n === name; });
  if (ex) ex.q++;
  else cart.push({ n: name, p: price, q: 1 });
  renderCart();
  toast('✓ ' + name + ' ajouté');
}

function changeQty(name, delta) {
  var ex = cart.find(function(c) { return c.n === name; });
  if (!ex) return;
  ex.q += delta;
  if (ex.q <= 0) cart = cart.filter(function(c) { return c.n !== name; });
  renderCart();
}

function clearCart() {
  cart = [];
  renderCart();
}

function renderCart() {
  var itemsEl  = document.getElementById('cart-items');
  var footerEl = document.getElementById('cart-footer');
  var countEl  = document.getElementById('cart-count');

  var count = cart.reduce(function(s, c) { return s + c.q; }, 0);
  countEl.textContent = count;

  if (!cart.length) {
    itemsEl.innerHTML = '<div class="cart-empty"><span style="font-size:28px">🛒</span>Votre panier est vide</div>';
    footerEl.style.display = 'none';
    return;
  }

  footerEl.style.display = 'block';
  var h = '';
  cart.forEach(function(c) {
    h += '<div class="cart-item">';
    h += '<div class="cart-item-name">' + c.n + '</div>';
    h += '<div class="qty-ctrl">';
    h += '<button class="qty-btn" onclick="changeQty(\'' + esc(c.n) + '\',-1)">−</button>';
    h += '<span class="qty-num">' + c.q + '</span>';
    h += '<button class="qty-btn" onclick="changeQty(\'' + esc(c.n) + '\',1)">+</button>';
    h += '</div>';
    h += '<div class="cart-item-price">' + (c.p * c.q).toFixed(2) + ' DH</div>';
    h += '</div>';
  });
  itemsEl.innerHTML = h;

  var sub   = cart.reduce(function(s, c) { return s + c.p * c.q; }, 0);
  var tva   = sub * 0.1;
  var total = sub + tva;
  document.getElementById('cart-sub').textContent   = sub.toFixed(2)   + ' DH';
  document.getElementById('cart-tva').textContent   = tva.toFixed(2)   + ' DH';
  document.getElementById('cart-total').textContent = total.toFixed(2) + ' DH';
}

function toggleCart() {
  var panel    = document.getElementById('cart-panel');
  var closeRow = document.getElementById('cart-close-row');
  var deskHdr  = document.getElementById('cart-header-desktop');
  var isMobile = window.innerWidth <= 768;
  panel.classList.toggle('mobile-open');
  if (closeRow) closeRow.style.display = (isMobile && panel.classList.contains('mobile-open')) ? 'flex' : 'none';
  if (deskHdr)  deskHdr.style.display  = (!isMobile || !panel.classList.contains('mobile-open')) ? 'flex' : 'none';
}

// ── Order Modal ───────────────────────────────────────────────
function openOrderModal() {
  if (!cart.length) { toast('⚠ Panier vide'); return; }
  document.getElementById('order-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('order-modal').classList.remove('open');
  // Reset payment selection for next order
  payMode = '';
  document.querySelectorAll('.pay-method-btn').forEach(function(b) { b.classList.remove('selected'); });
  var gc = document.getElementById('gift-card-field');
  if (gc) gc.classList.remove('show');
  var gcInp = document.getElementById('f-gift-code');
  if (gcInp) gcInp.value = '';
}

function toggleAddress() {
  var type   = document.getElementById('f-type').value;
  var addrEl = document.getElementById('f-addr-group');
  addrEl.style.display = type === 'delivery' ? 'block' : 'none';
}

function selectPay(btn) {
  document.querySelectorAll('.pay-method-btn').forEach(function(b) { b.classList.remove('selected'); });
  btn.classList.add('selected');
  payMode = btn.getAttribute('data-pay');

  // Show gift card code input only when gift_card is selected
  var gcField = document.getElementById('gift-card-field');
  if (gcField) {
    if (payMode === 'gift_card') {
      gcField.classList.add('show');
      setTimeout(function() {
        var inp = document.getElementById('f-gift-code');
        if (inp) inp.focus();
      }, 150);
    } else {
      gcField.classList.remove('show');
      var inp = document.getElementById('f-gift-code');
      if (inp) inp.value = '';
    }
  }
}

function confirmOrder() {
  var name     = document.getElementById('f-name').value.trim();
  var phone    = document.getElementById('f-phone').value.trim();
  var type     = document.getElementById('f-type').value;
  var addr     = document.getElementById('f-addr').value.trim();
  var notes    = document.getElementById('f-notes').value.trim();
  var giftCode = (document.getElementById('f-gift-code') || {}).value
                   ? document.getElementById('f-gift-code').value.trim().toUpperCase()
                   : '';

  // ── Validations ──────────────────────────────────────────
  if (!name)    { toast('⚠ Entrez votre prénom'); return; }
  if (!payMode) {
    // Flash all payment buttons to alert user
    document.querySelectorAll('.pay-method-btn').forEach(function(b) {
      b.style.borderColor = 'rgba(231,76,60,.6)';
      setTimeout(function(){ b.style.borderColor = ''; }, 1000);
    });
    toast('⚠ Choisissez un mode de paiement');
    return;
  }
  if (payMode === 'gift_card' && !giftCode) {
    var gcInput = document.getElementById('f-gift-code');
    if (gcInput) { gcInput.style.borderColor = 'var(--red)'; gcInput.focus(); setTimeout(function(){ gcInput.style.borderColor = 'var(--gold)'; }, 1000); }
    toast('⚠ Entrez le code de votre carte cadeau'); return;
  }
  if (type === 'delivery' && !addr) { toast('⚠ Entrez votre adresse'); return; }

  var sub   = cart.reduce(function(s,c) { return s + c.p * c.q; }, 0);
  var tva   = +(sub * 0.1).toFixed(2);
  var total = +(sub + tva).toFixed(2);

  var apiItems = cart.map(function(c) {
    return { name: c.n, price: c.p, qty: c.q };
  });

  // Build POS-enriched note
  var posNote = notes;
  if (payMode === 'tpe')       posNote = '💳 TPE requis à la table' + (notes ? ' — ' + notes : '');
  if (payMode === 'gift_card') posNote = '🎁 Carte Cadeau: ' + giftCode + (notes ? ' — ' + notes : '');
  if (payMode === 'cash')      posNote = '💵 Espèces' + (notes ? ' — ' + notes : '');

  var order = {
    source:        'web',
    type:          type,
    address:       addr,
    notes:         posNote,
    payMethod:     payMode,
    giftCardCode:  giftCode || null,   // null if not gift card
    table:         detectTableNum(),
    items:         apiItems,
    subtotal:      sub,
    total:         total,
    customer:      { name: name, phone: phone },
    _posHint: {
      method:       payMode,
      giftCardCode: giftCode || null,
      needsTpe:     payMode === 'tpe',
      isGiftCard:   payMode === 'gift_card',
    },
  };

  var confirmBtn = document.querySelector('.btn-confirm');
  confirmBtn.textContent = 'Envoi...';
  confirmBtn.disabled = true;

  // ── Save to API ──────────────────────────────────────────
  var API = window.LUX_API_URL || 'https://cafeslux-api-production.up.railway.app';
  fetch(API + '/api/orders', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(order),
  }).then(function(r) { return r.json(); })
    .then(function(res) {
      showSuccess(name, res.ref || res.id || res.order && res.order.id);
    })
    .catch(function() {
      // API unreachable — show success anyway (order queued offline)
      showSuccess(name, 'LX-' + String(Date.now()).slice(-6));
    });
}

// notifyWhatsApp removed — orders sent directly to POS via API

function showSuccess(name, ref) {
  closeModal();
  cart = [];
  renderCart();
  var el = document.getElementById('success-banner');
  var refStr = ref ? ' #' + String(ref).slice(-6) : '';
  el.innerHTML = '✅ Votre commande' + refStr + ' a été envoyée avec succès au comptoir!<br>' +
                 '<span style="font-size:11px;opacity:.8">Merci ' + name + ' — prête dans quelques minutes ✦</span>';
  el.style.display = 'block';
  document.querySelector('.btn-confirm').textContent = '✦ Confirmer →';
  document.querySelector('.btn-confirm').disabled = false;
  setTimeout(function() { el.style.display = 'none'; }, 5000);
}

// ── QR Table detection ────────────────────────────────────────
function detectTableNum() {
  var p = new URLSearchParams(window.location.search);
  return p.get('table') || p.get('table_id') || p.get('qr') || null;
}

function detectTable() {
  var p = new URLSearchParams(window.location.search);
  var table = p.get('table') || p.get('table_id') || p.get('qr');
  if (table) {
    var el = document.querySelector('.topbar-title');
    if (el) el.textContent = 'Table ' + table + ' — Commander';
    var sel = document.getElementById('f-type');
    if (sel) { sel.value = 'table'; sel.disabled = true; }
  }
}

// ── Init ──────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  buildMenu();
  renderCart();
  detectTable();
  // Show mobile FAB on small screens
  var fab = document.getElementById('cart-fab');
  if (fab && window.innerWidth <= 768) fab.style.display = 'flex';
  window.addEventListener('resize', function() {
    var fab2 = document.getElementById('cart-fab');
    if (fab2) fab2.style.display = window.innerWidth <= 768 ? 'flex' : 'none';
  });
});
