<!-- ── API Config ──────────────────────────────────────────── -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
/* ── Design Tokens ─────────────────────────────────────────── */
:root{
  --gold:#C9A84C;--gold-l:#E8C97A;--gold-d:#8B6E2F;
  --bg:#F9F5EE;--bg2:#FFFFFF;--bg3:#F0EAD9;
  --dark:#080808;--text:#1A0A00;--muted:#888;
  --border:rgba(201,168,76,.25);--border2:rgba(201,168,76,.5);
  --green:#2ECC71;--red:#E74C3C;
  --font-display:'Playfair Display',serif;
  --font-body:'DM Sans',sans-serif;
  --font-it:'Cormorant Garamond',serif;
  --topbar-h:60px;--sidebar-w:220px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;-webkit-font-smoothing:antialiased}
body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body);overflow:hidden}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
input,button,select,textarea{font-family:inherit}

/* ── Topbar ────────────────────────────────────────────────── */
.topbar{
  height:var(--topbar-h);background:var(--dark);
  display:flex;align-items:center;padding:0 16px;gap:12px;
  position:fixed;top:0;left:0;right:0;z-index:200;
  border-bottom:2px solid var(--gold-d);
}
.topbar-logo{font-family:var(--font-display);color:var(--gold);font-size:18px;letter-spacing:3px;flex:1}
.topbar-title{font-size:12px;color:rgba(240,232,213,.6);letter-spacing:2px;text-transform:uppercase}
.btn-back{
  padding:7px 16px;background:transparent;border:1px solid rgba(201,168,76,.4);
  border-radius:20px;color:var(--gold);font-size:11px;font-weight:600;cursor:pointer;
  letter-spacing:.5px;transition:.2s;
}
.btn-back:hover{background:rgba(201,168,76,.1)}
.cart-badge{
  background:var(--gold);color:#000;border-radius:50%;width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;
  margin-left:8px;cursor:pointer;transition:.2s;
}
.cart-badge:hover{transform:scale(1.1)}

/* ── Layout ────────────────────────────────────────────────── */
.app-layout{
  display:flex;height:100vh;padding-top:var(--topbar-h);
}

/* ── Sidebar (category nav) ────────────────────────────────── */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;background:var(--dark);
  overflow-y:auto;padding:12px 8px;border-right:1px solid rgba(201,168,76,.15);
}
.sidebar-label{font-size:9px;letter-spacing:3px;color:rgba(201,168,76,.4);text-transform:uppercase;padding:8px 8px 6px;margin-top:8px}
.cat-btn{
  width:100%;text-align:left;padding:9px 12px;border:none;background:none;
  color:rgba(240,232,213,.6);font-size:12px;font-weight:500;cursor:pointer;
  border-radius:8px;transition:.15s;display:flex;align-items:center;gap:8px;
}
.cat-btn:hover,.cat-btn:focus{background:rgba(201,168,76,.08);color:var(--gold)}
.cat-btn.active{background:linear-gradient(135deg,rgba(201,168,76,.18),rgba(201,168,76,.06));color:var(--gold);font-weight:700;border-left:3px solid var(--gold);padding-left:9px;}
.cat-btn.active{background:linear-gradient(135deg,rgba(201,168,76,.15),rgba(201,168,76,.05));color:var(--gold);font-weight:700;border-left:2px solid var(--gold)}

/* ── Menu Grid ─────────────────────────────────────────────── */
.menu-main{flex:1;overflow-y:auto;padding:16px}
.cat-section{margin-bottom:28px}
.cat-title{font-family:var(--font-display);font-size:20px;color:var(--text);margin-bottom:3px}
.cat-sub{font-size:11px;color:var(--muted);margin-bottom:12px}
.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.item-card{
  background:var(--bg2);border:1.5px solid var(--border);border-radius:12px;
  overflow:hidden;cursor:pointer;transition:.2s;
}
.item-card:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 4px 16px rgba(201,168,76,.15)}
.item-card.sig{border-color:rgba(201,168,76,.5)}
.item-img{width:100%;height:110px;object-fit:cover;background:var(--bg3);display:block}
.item-img-ph{
  width:100%;height:110px;display:flex;align-items:center;justify-content:center;
  font-size:32px;background:linear-gradient(135deg,#F5F0E5,#EDE5D5);
}
.sig-badge{background:var(--gold);color:#000;font-size:9px;font-weight:800;padding:3px 10px;letter-spacing:.5px;text-align:center}
.item-body{padding:10px}
.item-name{font-size:12px;font-weight:700;color:var(--text);margin-bottom:2px;line-height:1.3}
.item-sub{font-size:10px;color:var(--muted);margin-bottom:8px;line-height:1.4}
.item-footer{display:flex;align-items:center;justify-content:space-between}
.item-price{font-family:var(--font-display);font-size:15px;color:var(--gold);font-weight:700}
.btn-add{
  width:28px;height:28px;background:var(--gold);border:none;border-radius:8px;
  color:#000;font-size:18px;font-weight:900;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.15s;line-height:1;
}
.btn-add:hover{background:var(--gold-l);transform:scale(1.1)}

/* ── Cart Panel ────────────────────────────────────────────── */
.cart-panel{
  width:300px;flex-shrink:0;background:var(--dark);border-left:1px solid rgba(201,168,76,.15);
  display:flex;flex-direction:column;overflow:hidden;
}
.cart-header{
  padding:14px 16px;border-bottom:1px solid rgba(201,168,76,.15);
  display:flex;align-items:center;justify-content:space-between;
}
.cart-title{font-family:var(--font-display);font-size:14px;color:var(--gold);letter-spacing:2px}
.cart-clear{padding:4px 10px;background:transparent;border:1px solid rgba(201,168,76,.3);border-radius:8px;color:rgba(240,232,213,.5);font-size:10px;cursor:pointer}
.cart-clear:hover{border-color:var(--gold-d);color:var(--gold)}
.cart-items{flex:1;overflow-y:auto;padding:8px 0}
.cart-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:120px;color:rgba(240,232,213,.3);font-size:12px;gap:8px}
.cart-item{display:flex;align-items:center;padding:8px 14px;gap:10px;border-bottom:1px solid rgba(201,168,76,.06)}
.cart-item-name{flex:1;font-size:12px;color:rgba(240,232,213,.85);line-height:1.3}
.cart-item-price{font-family:'Playfair Display',serif;font-size:12px;color:var(--gold);flex-shrink:0}
.qty-ctrl{display:flex;align-items:center;gap:6px;flex-shrink:0}
.qty-btn{width:22px;height:22px;background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.2);border-radius:6px;color:var(--gold);font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.qty-btn:hover{background:rgba(201,168,76,.2)}
.qty-num{font-size:12px;color:rgba(240,232,213,.8);min-width:16px;text-align:center;font-weight:700}

/* ── Cart Footer ───────────────────────────────────────────── */
.cart-footer{padding:14px 16px;border-top:1px solid rgba(201,168,76,.15)}
.cart-totals{margin-bottom:12px}
.cart-row{display:flex;justify-content:space-between;font-size:11px;color:rgba(240,232,213,.55);margin-bottom:4px}
.cart-total-row{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid rgba(201,168,76,.15)}
.cart-total-label{font-size:12px;color:rgba(240,232,213,.7);letter-spacing:1px;text-transform:uppercase}
.cart-total-amount{font-family:var(--font-display);font-size:22px;color:var(--gold);font-weight:700}
.btn-order{
  width:100%;padding:13px;background:linear-gradient(135deg,var(--gold-d),var(--gold));
  border:none;border-radius:12px;color:#000;font-family:var(--font-display);
  font-size:15px;font-weight:700;cursor:pointer;letter-spacing:.5px;transition:.2s;
}
.btn-order:hover{background:linear-gradient(135deg,var(--gold),var(--gold-l));transform:translateY(-1px)}
.btn-order:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* ── Order Modal ───────────────────────────────────────────── */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);
  z-index:500;align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.open{display:flex!important;animation:fade-in .2s ease}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
.modal-box{
  background:#111;border:1px solid rgba(201,168,76,.35);border-radius:20px;
  padding:28px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;
}
.modal-title{font-family:var(--font-display);font-size:18px;color:var(--gold);letter-spacing:2px;margin-bottom:20px;text-align:center}
.field-group{margin-bottom:14px}
.field-label{font-size:11px;color:rgba(240,232,213,.5);margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase;display:block}
.field-input,.field-select,.field-textarea{
  width:100%;background:#1A1A1A;border:1px solid rgba(201,168,76,.2);border-radius:10px;
  color:#F0E8D5;padding:10px 14px;font-size:13px;outline:none;transition:.2s;
}
.field-input:focus,.field-select:focus,.field-textarea:focus{border-color:rgba(201,168,76,.5)}
.field-select option{background:#1A1A1A}
.field-textarea{resize:vertical;min-height:60px}
.pay-methods-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 18px}
.pay-method-btn{
  padding:10px;background:#1A1A1A;border:1.5px solid rgba(201,168,76,.15);
  border-radius:10px;color:rgba(240,232,213,.6);font-size:12px;font-weight:600;
  cursor:pointer;text-align:center;transition:.2s;
}
.pay-method-btn:hover{border-color:rgba(201,168,76,.4);color:var(--gold)}
.pay-method-btn.selected{border-color:var(--gold);background:rgba(201,168,76,.08);color:var(--gold)}
.modal-actions{display:flex;gap:8px;margin-top:4px}
.btn-cancel{flex:1;padding:12px;background:transparent;border:1px solid rgba(201,168,76,.2);border-radius:10px;color:rgba(240,232,213,.4);font-size:12px;cursor:pointer}
.btn-confirm{flex:2;padding:12px;background:linear-gradient(135deg,var(--gold-d),var(--gold));border:none;border-radius:10px;color:#000;font-size:13px;font-weight:800;cursor:pointer;letter-spacing:.5px}
.btn-confirm:hover{background:linear-gradient(135deg,var(--gold),var(--gold-l))}

/* ── Success Banner ────────────────────────────────────────── */
.success-banner{
  display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,#0D1A0D,#142014);
  border:1px solid rgba(46,204,113,.4);border-radius:14px;
  padding:14px 24px;color:#2ECC71;font-size:13px;font-weight:700;
  box-shadow:0 8px 32px rgba(0,0,0,.5);z-index:9000;text-align:center;
  animation:slide-up .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes slide-up{from{transform:translateX(-50%) translateY(60px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}

/* ── Toast ─────────────────────────────────────────────────── */
#toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(30px);
  background:#111;border:1px solid rgba(201,168,76,.4);border-radius:10px;
  padding:10px 20px;font-size:12px;color:#F0E8D5;z-index:9999;
  opacity:0;transition:.3s ease;pointer-events:none;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Responsive ────────────────────────────────────────────── */
@media(max-width:768px){
  .sidebar{display:none}
  .cart-panel{display:none}
  .cart-panel.mobile-open{display:flex;position:fixed;inset:0;top:var(--topbar-h);z-index:100;width:100%}
  .items-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
}
</style>
</head>

<!-- ═══════════════════════════════════════════════════════════
     TOPBAR
════════════════════════════════════════════════════════════ -->
<div class="topbar">
  <button class="btn-back" onclick="window.location.href='../index.html'">← Accueil</button>
  <div class="topbar-logo">✦ LUX</div>
  <div class="topbar-title">Commander</div>
  <div style="display:flex;align-items:center;gap:4px;cursor:pointer" onclick="toggleCart()">
    <span style="color:rgba(240,232,213,.5);font-size:11px">Panier</span>
    <div class="cart-badge" id="cart-count">0</div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     MAIN LAYOUT
════════════════════════════════════════════════════════════ -->
<div class="app-layout">

  <!-- Sidebar: category navigation -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-label">La Carte</div>
    <div id="cat-nav-list"></div>
  </nav>

  <!-- Menu grid -->
  <main class="menu-main" id="menu-content"></main>

  <!-- Cart panel -->
  <div class="cart-panel" id="cart-panel">
    <div class="cart-header">
      <span class="cart-title">✦ PANIER</span>
      <button class="cart-clear" onclick="clearCart()">Vider</button>
    </div>
    <div class="cart-items" id="cart-items">
      <div class="cart-empty">
        <span style="font-size:28px">🛒</span>
        Votre panier est vide
      </div>
    </div>
    <div class="cart-footer" id="cart-footer" style="display:none">
      <div class="cart-totals">
        <div class="cart-row"><span>Sous-total</span><span id="cart-sub">0.00 DH</span></div>
        <div class="cart-row"><span>TVA (10%)</span><span id="cart-tva">0.00 DH</span></div>
        <div class="cart-total-row">
          <span class="cart-total-label">Total</span>
          <span class="cart-total-amount" id="cart-total">0.00 DH</span>
        </div>
      </div>
      <button class="btn-order" onclick="openOrderModal()">Commander →</button>
    </div>
  </div>

</div><!-- /app-layout -->

<!-- ═══════════════════════════════════════════════════════════
     ORDER MODAL
════════════════════════════════════════════════════════════ -->
<div class="modal-overlay" id="order-modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-title">✦ Votre Commande</div>

    <div class="field-group">
      <label class="field-label">Nom du client *</label>
      <input id="f-name" type="text" class="field-input" placeholder="Votre prénom...">
    </div>
    <div class="field-group">
      <label class="field-label">Téléphone WhatsApp *</label>
      <input id="f-phone" type="tel" class="field-input" placeholder="+212 6XX XXX XXX">
    </div>
    <div class="field-group">
      <label class="field-label">Type de commande</label>
      <select id="f-type" class="field-select" onchange="toggleAddress()">
        <option value="table">Sur place (Table)</option>
        <option value="takeaway">À emporter</option>
        <option value="delivery">Livraison à domicile</option>
      </select>
    </div>
    <div class="field-group" id="f-addr-group" style="display:none">
      <label class="field-label">Adresse de livraison</label>
      <input id="f-addr" type="text" class="field-input" placeholder="Votre adresse complète...">
    </div>
    <div class="field-group">
      <label class="field-label">Notes spéciales</label>
      <textarea id="f-notes" class="field-textarea" placeholder="Allergies, préférences..."></textarea>
    </div>

    <div class="field-label" style="margin-bottom:8px">Mode de paiement</div>
    <div class="pay-methods-grid">
      <div class="pay-method-btn selected" data-pay="cash" onclick="selectPay(this)">💵 Espèces</div>
      <div class="pay-method-btn" data-pay="card" onclick="selectPay(this)">💳 Carte</div>
      <div class="pay-method-btn" data-pay="paypal" onclick="selectPay(this)">🅿️ PayPal</div>
      <div class="pay-method-btn" data-pay="tpe" onclick="selectPay(this)">📟 TPE</div>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="btn-confirm" onclick="confirmOrder()">✦ Confirmer →</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     SUCCESS BANNER
════════════════════════════════════════════════════════════ -->
<div class="success-banner" id="success-banner">
  ✅ Commande envoyée ! Nous vous contactons bientôt.
</div>

<!-- Toast -->
<div id="toast"></div>

// ── Cart State ────────────────────────────────────────────────
var cart    = [];
var payMode = 'cash';

// ── Utility ───────────────────────────────────────────────────
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(function() { el.classList.remove('show'); }, 2500);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;');
}

function today() {
  return new Date().toISOString().slice(0,10);
}

function nowTime() {
  return new Date().toLocaleTimeString('fr-MA',{hour:'2-digit',minute:'2-digit'});
}

// ── Build menu DOM ────────────────────────────────────────────
function buildMenu() {
  var nav  = document.getElementById('cat-nav-list');
  var main = document.getElementById('menu-content');
  var navH = '', mainH = '';

  MENU.forEach(function(cat, i) {
    navH += '<button class="cat-btn' + (i===0?' active':'') + '"' +
            ' onclick="scrollToCat(\'' + cat.id + '\',this)">' +
            cat.icon + ' ' + cat.title + '</button>';

    mainH += '<div class="cat-section" id="cat-' + cat.id + '" style="display:' + (i===0?'block':'none') + '">';
    mainH += '<div class="cat-title">' + cat.icon + ' ' + cat.title + '</div>';
    if (cat.sub) mainH += '<div class="cat-sub">' + cat.sub + '</div>';
    mainH += '<div class="items-grid">';

    cat.items.forEach(function(item) {
      var sigCls = item.sig ? ' sig' : '';
      mainH += '<div class="item-card' + sigCls + '" onclick="addToCart(\'' + esc(item.n) + '\',' + item.p + ')">';
      if (item.sig) mainH += '<div class="sig-badge">⭐ SIGNATURE</div>';
      if (item.img) {
      var imgEl = document.createElement('img');
      imgEl.className = 'item-img';
      imgEl.src = item.img.startsWith('http') ? item.img : item.img;
      imgEl.alt = item.n;
      imgEl.loading = 'lazy';
      imgEl.setAttribute('data-fallback', cat.icon);
      mainH += '<img class="item-img" src="' + item.img + '" alt="' + item.n + '" loading="lazy" ' +
               'onerror="this.onerror=null;this.style.display=\'none\';var ph=this.nextElementSibling;if(ph)ph.style.display=\'flex\'">';
      mainH += '<div class="item-img-ph" style="display:none">' + cat.icon + '</div>';
    } else {
      mainH += '<div class="item-img-ph">' + cat.icon + '</div>';
    }
      mainH += '<div class="item-body">';
      mainH += '<div class="item-name">' + item.n + '</div>';
      if (item.s) mainH += '<div class="item-sub">' + item.s + '</div>';
      mainH += '<div class="item-footer">';
      mainH += '<div class="item-price">' + item.p + ' DH</div>';
      mainH += '<button class="btn-add" onclick="event.stopPropagation();addToCart(\'' + esc(item.n) + '\',' + item.p + ')">+</button>';
      mainH += '</div></div></div>';
    });

    mainH += '</div></div>';
  });

  nav.innerHTML  = navH;
  main.innerHTML = mainH;
}

function scrollToCat(id, btn) {
  // Update active tab button
  document.querySelectorAll('.cat-btn').forEach(function(b) { b.classList.remove('active'); });
  if (btn) btn.classList.add('active');

  // Show only the selected category section — hide all others
  document.querySelectorAll('.cat-section').forEach(function(s) {
    s.style.display = 'none';
  });
  var el = document.getElementById('cat-' + id);
  if (el) {
    el.style.display = 'block';
    // Scroll menu-main to top
    var mc = document.getElementById('menu-content');
    if (mc) mc.scrollTop = 0;
  }
}

// ── Cart Logic ────────────────────────────────────────────────
function addToCart(name, price) {
  var ex = cart.find(function(c) { return c.n === name; });
  if (ex) ex.q++;
  else cart.push({ n: name, p: price, q: 1 });
  renderCart();
  toast('✓ ' + name + ' ajouté');
}

function changeQty(name, delta) {
  var ex = cart.find(function(c) { return c.n === name; });
  if (!ex) return;
  ex.q += delta;
  if (ex.q <= 0) cart = cart.filter(function(c) { return c.n !== name; });
  renderCart();
}

function clearCart() {
  cart = [];
  renderCart();
}

function renderCart() {
  var itemsEl  = document.getElementById('cart-items');
  var footerEl = document.getElementById('cart-footer');
  var countEl  = document.getElementById('cart-count');

  var count = cart.reduce(function(s, c) { return s + c.q; }, 0);
  countEl.textContent = count;

  if (!cart.length) {
    itemsEl.innerHTML = '<div class="cart-empty"><span style="font-size:28px">🛒</span>Votre panier est vide</div>';
    footerEl.style.display = 'none';
    return;
  }

  footerEl.style.display = 'block';
  var h = '';
  cart.forEach(function(c) {
    h += '<div class="cart-item">';
    h += '<div class="cart-item-name">' + c.n + '</div>';
    h += '<div class="qty-ctrl">';
    h += '<button class="qty-btn" onclick="changeQty(\'' + esc(c.n) + '\',-1)">−</button>';
    h += '<span class="qty-num">' + c.q + '</span>';
    h += '<button class="qty-btn" onclick="changeQty(\'' + esc(c.n) + '\',1)">+</button>';
    h += '</div>';
    h += '<div class="cart-item-price">' + (c.p * c.q).toFixed(2) + ' DH</div>';
    h += '</div>';
  });
  itemsEl.innerHTML = h;

  var sub   = cart.reduce(function(s, c) { return s + c.p * c.q; }, 0);
  var tva   = sub * 0.1;
  var total = sub + tva;
  document.getElementById('cart-sub').textContent   = sub.toFixed(2)   + ' DH';
  document.getElementById('cart-tva').textContent   = tva.toFixed(2)   + ' DH';
  document.getElementById('cart-total').textContent = total.toFixed(2) + ' DH';
}

function toggleCart() {
  var panel = document.getElementById('cart-panel');
  panel.classList.toggle('mobile-open');
}

// ── Order Modal ───────────────────────────────────────────────
function openOrderModal() {
  if (!cart.length) { toast('⚠ Panier vide'); return; }
  document.getElementById('order-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('order-modal').classList.remove('open');
}

function toggleAddress() {
  var type   = document.getElementById('f-type').value;
  var addrEl = document.getElementById('f-addr-group');
  addrEl.style.display = type === 'delivery' ? 'block' : 'none';
}

function selectPay(btn) {
  document.querySelectorAll('.pay-method-btn').forEach(function(b) { b.classList.remove('selected'); });
  btn.classList.add('selected');
  payMode = btn.getAttribute('data-pay');
}

function confirmOrder() {
  var name  = document.getElementById('f-name').value.trim();
  var phone = document.getElementById('f-phone').value.trim();
  var type  = document.getElementById('f-type').value;
  var addr  = document.getElementById('f-addr').value.trim();
  var notes = document.getElementById('f-notes').value.trim();

  if (!name)  { toast('⚠ Entrez votre prénom'); return; }
  if (!phone) { toast('⚠ Entrez votre téléphone'); return; }
  if (type === 'delivery' && !addr) { toast('⚠ Entrez votre adresse'); return; }

  var sub   = cart.reduce(function(s,c) { return s + c.p * c.q; }, 0);
  var tva   = +(sub * 0.1).toFixed(2);
  var total = +(sub + tva).toFixed(2);

  var apiItems = cart.map(function(c) {
    return { name: c.n, price: c.p, qty: c.q };
  });

  var order = {
    source:     'web',
    type:       type,
    address:    addr,
    notes:      notes,
    payMethod:  payMode,
    table:      null,
    items:      apiItems,
    subtotal:   sub,
    total:      total,
    customer:   { name: name, phone: phone },
  };

  var confirmBtn = document.querySelector('.btn-confirm');
  confirmBtn.textContent = 'Envoi...';
  confirmBtn.disabled = true;

  // ── Save to API ──────────────────────────────────────────
  var API = window.LUX_API_URL || 'https://cafeslux-api-production.up.railway.app';
  fetch(API + '/api/orders', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(order),
  }).then(function(r) { return r.json(); })
    .then(function(res) {
      showSuccess(name, res.ref || res.id);
      notifyWhatsApp(name, phone, type, addr, total, payMode);
    })
    .catch(function() {
      // Fallback: save locally + WhatsApp
      showSuccess(name, 'LX-' + String(Date.now()).slice(-6));
      notifyWhatsApp(name, phone, type, addr, total, payMode);
    });
}

function notifyWhatsApp(name, phone, type, addr, total, payMode) {
  var items_str = cart.map(function(c) { return c.q + 'x ' + c.n + ' (' + c.p + ' DH)'; }).join(', ');
  var msg = encodeURIComponent(
    '🛒 Nouvelle Commande — Café LUX\n\n' +
    'Client: ' + name + ' (' + phone + ')\n' +
    'Type: ' + type + (addr ? ' — ' + addr : '') + '\n' +
    'Paiement: ' + payMode + '\n' +
    'Articles: ' + items_str + '\n' +
    'Total: ' + total + ' DH'
  );
  setTimeout(function() {
    window.open('https://wa.me/212677717201?text=' + msg, '_blank');
  }, 300);
}

function showSuccess(name, ref) {
  closeModal();
  cart = [];
  renderCart();
  var el = document.getElementById('success-banner');
  el.textContent = '✅ Commande ' + (ref ? '#' + String(ref).slice(-6) : '') + ' envoyée, ' + name + '!';
  el.style.display = 'block';
  document.querySelector('.btn-confirm').textContent = '✦ Confirmer →';
  document.querySelector('.btn-confirm').disabled = false;
  setTimeout(function() { el.style.display = 'none'; }, 5000);
}

// ── QR Table detection ────────────────────────────────────────
function detectTable() {
  var p = new URLSearchParams(window.location.search);
  var table = p.get('table') || p.get('table_id') || p.get('qr');
  if (table) {
    var el = document.querySelector('.topbar-title');
    if (el) el.textContent = 'Table ' + table + ' — Commander';
    var sel = document.getElementById('f-type');
    if (sel) { sel.value = 'table'; sel.disabled = true; }
  }
}

// ── Init ──────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  buildMenu();
  renderCart();
  detectTable();
});
</script>
